services:
  llama-cpp:
    image: amperecomputingai/llama.cpp:3.4.2   # Ampere Altra 优化版，注意不是 -ampereone 后缀（那是另一颗芯片，在 A1 上跑不了）
    container_name: llama-cpp
    hostname: llama-cpp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
      LLAMA_ARG_THREADS: "3"     # router 模式下每个子模型进程读这个环境变量决定线程数，命令行 -t 不会传给子进程
      LLAMA_ARG_CTX_SIZE: "8192" # 不设的话默认读模型原生最大上下文（Hermes-3.2 是 131072），
                                  # 实测 KV cache 直接要 21.5GB，把加载进程弄崩了；8192 对这台机器更现实
      LLAMA_ARG_CACHE_RAM: "4096" # prompt cache 上限，退回只用 3B 后内存余量够，改回 4G，
                                   # 能同时"记住"更多历史对话，减少长对话重新处理的概率
    command: >
      --models-dir /models
      --models-max 1
      --host 0.0.0.0
      --port 8080
    volumes:
      - /etc/llama-cpp/models:/models
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "3"   # 留 1 核给 npm/3x-ui 等其他服务，避免生成时把它们饿死
          memory: "9G" # cache 上限改回 4G 后理论最大约 7.44GB（权重+KV cache+4G cache），
                       # 相应把上限从 8G 提到 9G，留够 ~1.5GB 余量；
                       # 超出会被 OOM killer 直接杀掉，不是优雅降级，所以留够余量很重要
    # router 模式：/models 目录下每个 .gguf 文件就是一个可选模型，id = 文件名去掉 .gguf 后缀，
    # 通过 open-webui / sillytavern 请求里的 model 字段按需加载/卸载，模型之间切换不用重启容器。
    # 新增模型文件（而不是在已有模型间切换）需要重启容器才能被扫描到。
    # --models-max 1：同时只常驻 1 个模型，加了 8B 模型后内存吃紧，改成不允许两个模型同时占内存；
    # 代价是 /models 目录下如果有多个模型文件，来回切换会变成每次冷加载，不再是"切换不用重载"。
    # 首次部署前手动下载模型到 /etc/llama-cpp/models（router 模式不支持 -hf 自动下载），例如：
    #   curl -L -o /etc/llama-cpp/models/Hermes-3-Llama-3.2-3B.Q4_K_M.gguf \
    #     "https://huggingface.co/NousResearch/Hermes-3-Llama-3.2-3B-GGUF/resolve/main/Hermes-3-Llama-3.2-3B.Q4_K_M.gguf"
    # 曾经短暂试过 Dolphin3.0-Llama3.1-8B（无审查倾向、盼着能更聪明一些），实测比 3B 慢一倍以上、
    # 效果提升有限，已经卸载并删除模型文件，退回只用 3B。
    # 注：router 模式官方标注为 experimental，不建议在不受信任的环境暴露；这里只在 proxy 内网被
    # open-webui/sillytavern 两个自己的容器访问，不发布到宿主机端口，也不接 NPM。

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.11.0
    container_name: open-webui
    hostname: open-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env   # 需要一行 WEBUI_SECRET_KEY=<openssl rand -hex 32>，本目录下已生成，不提交
    environment:
      TZ: "Asia/Hong_Kong"
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URLS: "http://llama-cpp:8080/v1"
      OPENAI_API_KEYS: "sk-not-required"   # 占位值，llama.cpp 默认不校验 key，不是真密钥
    volumes:
      - /etc/openwebui/data:/app/backend/data
    networks:
      - proxy
    depends_on:
      - llama-cpp
    # NPM 反代配置: Forward Hostname/IP = open-webui, Forward Port = 8080（未发布到宿主机）
    # 首次部署：先访问域名注册第一个账号（自动成为管理员），
    # 之后在 environment 里加一行 ENABLE_SIGNUP: "false" 并 up -d 重启，关闭后续注册。

  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:1.18.0
    container_name: sillytavern
    hostname: sillytavern
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env   # SILLYTAVERN_BASICAUTHUSER_USERNAME / _PASSWORD，见下面的说明
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - /etc/sillytavern/config:/home/node/app/config
      - /etc/sillytavern/data:/home/node/app/data
      - /etc/sillytavern/plugins:/home/node/app/plugins
      - /etc/sillytavern/extensions:/home/node/app/public/scripts/extensions/third-party
    networks:
      - proxy
    depends_on:
      - llama-cpp
    # 接后端：界面里选 Chat Completion -> Custom (OpenAI-compatible)，Base URL 填
    # http://llama-cpp:8080/v1，跟 open-webui 共用同一个 llama-cpp。
    # NPM 反代配置: Forward Hostname/IP = sillytavern, Forward Port = 8000（未发布到宿主机），
    # Access List 选 self-only（跟 open-webui 同级保护）。
    # 首次启动会在 config 卷里生成默认 config.yaml，实测过两个坑：
    #  1. ST 自己有个安全闸门 —— listen:true 时如果 whitelistMode/basicAuthMode/账号密码全都没开，
    #     直接 process.exit(1) 拒绝启动，不是仅仅打个警告。
    #  2. IP whitelistMode 配 whitelistDockerHosts:true 也没用，它只认默认 bridge 网关，
    #     不认我们这种自定义 proxy 网络里的容器 IP，实测请求照样被 403。
    # 所以关了 whitelistMode，开了 basicAuthMode（config.yaml 里这个布尔值本身不是密钥，留在文件里）。
    # 账号密码是敏感信息，没有直接写在 config.yaml 里，用 SILLYTAVERN_<path>（ST 自带的通用 env 覆盖
    # 机制，任意 config.yaml 路径都能用 SILLYTAVERN_XXX_YYY 覆盖）从上面的 .env 注入，跟 open-webui
    # 的 WEBUI_SECRET_KEY 走的是同一套模式，不进 git。

networks:
  proxy:
    external: true   # 手动创建一次：docker network create proxy
