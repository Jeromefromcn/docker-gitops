services:
  subconverter:
    image: tindy2013/subconverter@sha256:9fd004f00e90a7f67631f4d9a3f435c95b0fe58e7afdce8b8c6ca28c92826632
    container_name: subconverter
    hostname: subconverter
    restart: unless-stopped          # 重启/崩溃自动拉起
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:25500/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      TZ: "Asia/Hong_Kong"           # 容器时区:香港 (UTC+8)
    ports:
      - "58217:25500"                # 订阅转换 API(容器内固定监听 25500,宿主机换成随机端口避免被识别);调用方式: /sub?target=clash&url=<3x-ui订阅URL>&config=<可选的自定义规则模板URL>
