services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    hostname: homepage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
      HOMEPAGE_ALLOWED_HOSTS: "homepage.jerome.cloudns.asia"  # 需与访问用的域名一致，不然 403（NPM 域名如不同要同步改）
    volumes:
      - ./config:/app/config                                 # 配置纳入 git 版本控制
      - /var/run/docker.sock:/var/run/docker.sock:ro          # 只读:仅用于容器状态/资源小组件展示，不做写操作
    networks:
      - proxy
    # NPM 反代配置: Forward Hostname/IP = homepage, Forward Port = 3000（未发布到宿主机）

networks:
  proxy:
    external: true   # 手动创建一次：docker network create proxy
