apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: "1.30.3"
      helm:
        releaseName: istio-base
        valueFiles:
          - $values/vps_oracle/k3s/istio/base-values.yaml
    - repoURL: https://github.com/Jeromefromcn/docker-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod's own certificate/webhook controller flips this webhook's
  # failurePolicy from the chart's Ignore to Fail at runtime. Without
  # ignoreDifferences this shows permanent OutOfSync and selfHeal keeps
  # re-syncing it back to Ignore, which istiod immediately reverts —
  # an unbounded fight. Same pattern as kyverno.yaml's ignoreDifferences.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
