apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: "3.8.2"
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/vps_oracle/k3s/kyverno/values.yaml
    - repoURL: https://github.com/Jeromefromcn/docker-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Jeromefromcn/docker-gitops.git
      targetRevision: main
      path: vps_oracle/k3s/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # kyverno strips the empty labels/annotations maps the chart renders onto its
  # own CRDs, and adds spec defaults + status to its ClusterPolicies at runtime.
  # Without ignoreDifferences this shows as permanent OutOfSync and selfHeal
  # keeps re-syncing (each sync re-runs the PostSync migrate job and churns the
  # admission controller).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.labels
        - .metadata.annotations
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .status
        - .spec.admission
        - .spec.background
        - .spec.emitWarning
        - .spec.rules[]?.skipBackgroundRequests
        - .spec.rules[]?.context[]?.apiCall?.method
        - .spec.rules[]?.validate?.allowExistingViolations
        - .spec.rules[]?.verifyImages[]?.required
        - .spec.rules[]?.verifyImages[]?.useCache
        - .spec.rules[]?.verifyImages[]?.attestors[]?.entries[]?.signatureAlgorithm
    # restrict-image-registry (main-branch policy) relies on Kyverno's injected
    # verifyDigest:true default (its Deployments are always hand-pinned by
    # digest already) — scoped by name, not the blanket entry above, so that
    # restrict-image-registry-pr-lanes' explicit verifyDigest:false (needed
    # because PR-lane Deployments are tag-pinned, not digest-pinned) actually
    # gets enforced by ArgoCD instead of being silently ignored too.
    - group: kyverno.io
      kind: ClusterPolicy
      name: restrict-image-registry
      jqPathExpressions:
        - .spec.rules[]?.verifyImages[]?.verifyDigest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
