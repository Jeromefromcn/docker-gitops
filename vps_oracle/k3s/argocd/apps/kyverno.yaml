apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: "3.8.2"
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/vps_oracle/k3s/kyverno/values.yaml
    - repoURL: https://github.com/Jeromefromcn/docker-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Jeromefromcn/docker-gitops.git
      targetRevision: main
      path: vps_oracle/k3s/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # kyverno re-adds an empty `labels: {}` map to its own CRDs at runtime, which
  # otherwise shows as permanent OutOfSync and keeps selfHeal re-syncing (each
  # sync re-runs the PostSync migrate job and churns the admission controller).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
