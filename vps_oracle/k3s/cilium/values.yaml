kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
# trivy-operator.skip: opts the cilium-agent DaemonSet out of trivy
# vulnerability scanning entirely (see the 2026-08-17 incident doc).
# skipInitContainers in trivy-operator/values.yaml turned out to only
# affect the "does a report already exist" check, not the actual scan
# job's container list -- GetScanJobSpec (trivy-operator's plugin code)
# rebuilds it from scratch without that flag, so cilium's 6 initContainers
# (identical image to cilium-agent itself) kept getting scanned as 6
# parallel containers in one job pod, self-contending for the shared
# trivy filesystem cache lock every ~45-80s indefinitely, and appeared to
# be starving other workloads out of the single concurrent-scan-job slot.
# Losing cilium-agent's own vulnerability coverage is a real cost (unlike
# the initContainers, which were 100% redundant with it) -- accepted
# because the alternative was an unresolvable retry loop, not a coverage
# choice made lightly.
#
# IMPORTANT: this chart has no values key that puts a label on just the
# cilium-agent DaemonSet's own metadata.labels -- podLabels only reaches
# spec.template.metadata.labels (the pods, not the DaemonSet object
# itself), and trivy-operator's skip check reads the DaemonSet object's
# own labels (kube.GetLabels()), not the pod template. commonLabels DOES
# reach the DaemonSet's own metadata, but it's applied chart-wide (every
# resource: hubble-relay, hubble-ui, cilium-operator, cilium-envoy too),
# which would skip scanning far more than intended. So this label is
# applied out-of-band instead, directly on the live resource:
#   kubectl -n kube-system label daemonset cilium trivy-operator.skip=true --overwrite
# It's metadata-only (no pod template change), so it doesn't trigger a
# rollout, and Helm leaves labels it doesn't itself template alone on
# subsequent `helm upgrade` -- but it means this file alone doesn't fully
# describe live state; re-apply the kubectl command above if the
# DaemonSet is ever recreated from scratch.
# Explicit pod CIDR: the chart default (10.0.0.0/8 split into /24s) collided
# with this node's real Oracle VCN subnet (10.0.0.0/24, DHCP-assigned on
# enp0s6) — see README.md's "Pod CIDR" section for the incident and fix.
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.42.0.0/16"
    clusterPoolIPv4MaskSize: 24
# TZ so pod-local log timestamps (where the underlying binary honors $TZ)
# match the rest of the fleet — see root README.md's TZ convention.
extraEnv:
  - name: TZ
    value: "Asia/Hong_Kong"
# Sized off observed idle usage (agent ~30m/171Mi, everything else single-digit
# m / tens of Mi) with headroom for bursts. Previously unset on every
# kube-system/Cilium component, meaning the CNI had no ceiling at all.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
envoy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
operator:
  replicas: 1
  extraEnv:
    - name: TZ
      value: "Asia/Hong_Kong"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
hubble:
  enabled: true
  relay:
    enabled: true
    extraEnv:
      - name: TZ
        value: "Asia/Hong_Kong"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    backend:
      extraEnv:
        - name: TZ
          value: "Asia/Hong_Kong"
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
