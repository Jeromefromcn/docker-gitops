kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
# Explicit pod CIDR: the chart default (10.0.0.0/8 split into /24s) collided
# with this node's real Oracle VCN subnet (10.0.0.0/24, DHCP-assigned on
# enp0s6) — see README.md's "Pod CIDR" section for the incident and fix.
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.42.0.0/16"
    clusterPoolIPv4MaskSize: 24
# TZ so pod-local log timestamps (where the underlying binary honors $TZ)
# match the rest of the fleet — see root README.md's TZ convention.
extraEnv:
  - name: TZ
    value: "Asia/Hong_Kong"
operator:
  replicas: 1
  extraEnv:
    - name: TZ
      value: "Asia/Hong_Kong"
hubble:
  enabled: true
  relay:
    enabled: true
    extraEnv:
      - name: TZ
        value: "Asia/Hong_Kong"
  ui:
    enabled: true
    backend:
      extraEnv:
        - name: TZ
          value: "Asia/Hong_Kong"
