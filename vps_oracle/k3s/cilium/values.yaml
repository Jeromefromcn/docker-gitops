kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
# Explicit pod CIDR: the chart default (10.0.0.0/8 split into /24s) collided
# with this node's real Oracle VCN subnet (10.0.0.0/24, DHCP-assigned on
# enp0s6) — see README.md's "Pod CIDR" section for the incident and fix.
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.42.0.0/16"
    clusterPoolIPv4MaskSize: 24
# TZ so pod-local log timestamps (where the underlying binary honors $TZ)
# match the rest of the fleet — see root README.md's TZ convention.
extraEnv:
  - name: TZ
    value: "Asia/Hong_Kong"
# Sized off observed idle usage (agent ~30m/171Mi, everything else single-digit
# m / tens of Mi) with headroom for bursts. Previously unset on every
# kube-system/Cilium component, meaning the CNI had no ceiling at all.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
envoy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
operator:
  replicas: 1
  extraEnv:
    - name: TZ
      value: "Asia/Hong_Kong"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
hubble:
  enabled: true
  relay:
    enabled: true
    extraEnv:
      - name: TZ
        value: "Asia/Hong_Kong"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    backend:
      extraEnv:
        - name: TZ
          value: "Asia/Hong_Kong"
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
