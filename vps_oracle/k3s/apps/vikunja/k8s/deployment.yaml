apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: workloads
  labels:
    app: vikunja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      # 不加会注入 VIKUNJA_PORT=tcp://...，撞 vikunja 自己的 VIKUNJA_* 配置（trilium 教訓）
      enableServiceLinks: false
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.4.0
          ports:
            - containerPort: 3456
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: VIKUNJA_DATABASE_TYPE
              value: sqlite
            - name: VIKUNJA_DATABASE_PATH
              value: /db/vikunja.db
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "https://vikunja.jerome.cloudns.asia"
            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "false"
            - name: VIKUNJA_OUTGOINGREQUESTS_ALLOWNONROUTABLEIPS
              value: "true"
            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja
                  key: VIKUNJA_SERVICE_SECRET
          volumeMounts:
            - name: data
              mountPath: /db
              subPath: db
            - name: data
              mountPath: /app/vikunja/files
              subPath: files
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vikunja
