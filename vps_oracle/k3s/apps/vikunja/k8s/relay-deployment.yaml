apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja-notify-relay
  namespace: workloads
  labels:
    app: vikunja-notify-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vikunja-notify-relay
  template:
    metadata:
      labels:
        app: vikunja-notify-relay
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/jeromefromcn/vikunja-notify-relay@sha256:163e88a174aad5e477e475d8d5d4f2dea66f44de08ecf0ea0771ff24327214b7
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: VIKUNJA_BASE_URL
              value: "https://vikunja.jerome.cloudns.asia"
            - name: APPRISE_BASE_URL
              value: "http://apprise:8000"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
