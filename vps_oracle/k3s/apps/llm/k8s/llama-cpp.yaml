apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llm
  labels:
    app: llama-cpp
spec:
  # Scaled to 0 by default, same as the compose stack's normal "off" state —
  # this whole stack is only turned on when actually needed. Bring it up by
  # setting replicas: 1 here (and the other two Deployments in this app),
  # commit, push. `kubectl scale` does NOT work — no ignoreDifferences is
  # configured for replicas, so ArgoCD's selfHeal reverts a manual scale
  # within ~20s (confirmed 2026-08-13). Scale back down the same way (edit,
  # commit, push) when done.
  replicas: 1
  # RollingUpdate's default maxSurge needs 2x this pod's requests/limits to
  # briefly coexist during a rollout — llm-quota is sized for steady-state
  # (3 pods), not a surge pod on top, so a rolling update deadlocks against
  # the quota (new pod FailedCreate forever, old pod never torn down).
  # Recreate avoids ever needing double the resources at once. Also avoids
  # two pods trying to mount the same RWO PVC simultaneously.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      enableServiceLinks: false
      containers:
        - name: llama-cpp
          image: amperecomputingai/llama.cpp:3.4.2
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: LLAMA_ARG_THREADS
              value: "3"
            - name: LLAMA_ARG_CTX_SIZE
              value: "8192"
            - name: LLAMA_ARG_CACHE_RAM
              value: "4096"
          args:
            - --models-dir
            - /models
            - --models-max
            - "1"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 10Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  namespace: llm
spec:
  selector:
    app: llama-cpp
  ports:
    - port: 8080
      targetPort: 8080
