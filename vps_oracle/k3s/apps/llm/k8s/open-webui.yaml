apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app: open-webui
spec:
  # Scaled to 0 by default — see llama-cpp.yaml for the reasoning and how
  # to bring the stack back up.
  replicas: 1
  # See llama-cpp.yaml for why: llm-quota is sized for steady-state, a
  # RollingUpdate surge pod deadlocks against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      enableServiceLinks: false
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:0.11.0
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OPENAI_API_BASE_URLS
              value: "http://llama-cpp:8080/v1"
            - name: OPENAI_API_KEYS
              value: "sk-not-required"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_SECRET_KEY
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 300m
              memory: 1.5Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30089
