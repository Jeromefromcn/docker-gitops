apiVersion: v1
kind: Pod
metadata:
  name: llm-migration-seed
  namespace: llm
  labels:
    app: llm-migration-seed
spec:
  containers:
    - name: seed
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: llama-cpp-models
          mountPath: /dst/llama-cpp-models
        - name: open-webui-data
          mountPath: /dst/open-webui-data
        - name: sillytavern-data
          mountPath: /dst/sillytavern-data
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: llama-cpp-models
      persistentVolumeClaim:
        claimName: llama-cpp
    - name: open-webui-data
      persistentVolumeClaim:
        claimName: open-webui
    - name: sillytavern-data
      persistentVolumeClaim:
        claimName: sillytavern
