# Points Headlamp's Prometheus plugin at the standalone Prometheus that runs
# as plain docker compose on this same host (vps_oracle/compose/monitoring/),
# not inside k3s, at its fixed IP on the docker `proxy` network (172.19.0.4,
# registered in README.md's 网络隔离 static-IP table and pinned in that
# compose file's prometheus.networks.proxy.ipv4_address).
#
# Headlamp queries this via the k3s apiserver's built-in service proxy
# (/api/v1/namespaces/headlamp/services/external-prometheus/proxy/...). In
# Headlamp: Settings > Plugins > Prometheus, disable auto-detect, set
# address to `headlamp/external-prometheus`.
#
# A Service needs a backing EndpointSlice for the proxy subresource to have
# anything to proxy to. A hand-authored EndpointSlice/Endpoints can't be
# used here: this cluster's argocd-cm globally excludes both kinds from
# resource.exclusions (cuts watch/event volume, applies cluster-wide) so
# ArgoCD silently never applies them — confirmed by pushing one twice and
# watching `argocd app get headlamp` never list it. So instead of a manual
# EndpointSlice, this Service gets a selector pointing at a real pod below,
# and Kubernetes' own endpoint-slice-controller (not ArgoCD, not excluded)
# creates and self-heals its EndpointSlice automatically forever.
#
# That pod is a minimal socat TCP relay, 9090 -> 172.19.0.4:9090, running
# with hostNetwork so it can reach the docker `proxy` bridge directly (same
# reachability any host process has — see the same reasoning previously
# used for the k3s apiserver itself). The headlamp namespace enforces the
# `baseline` Pod Security Standard (label from
# vps_oracle/k3s/manifests/pod-security-labels.yaml, synced by the
# phase-a-foundation Application), and `baseline` DOES NOT allow hostNetwork
# (verified via `kubectl apply --dry-run=server`:
# "violates PodSecurity baseline: host namespaces (hostNetwork=true)";
# only the `restricted` tier is stricter, but baseline already rejects this).
# This deployment predates the enforce label (created 2026-08-17, label
# applied 2026-08-18), so it still runs today — PSS only blocks pod creation,
# it does not evict existing pods. KNOWN HAZARD: the moment this pod is
# recreated (node restart, rollout, ArgoCD prune+recreate), admission will
# refuse it and headlamp's Prometheus datasource breaks. Do not delete this
# pod/deployment without first migrating it off hostNetwork (there is no
# drop-in replacement: pod network cannot reach the docker `proxy` bridge —
# tested 2026-08-21, a non-hostNetwork socat pod gets CONNECT_FAIL to
# 172.19.0.4:9090) or relaxing headlamp's PSS label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-prometheus-proxy
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-prometheus-proxy
  template:
    metadata:
      labels:
        app: external-prometheus-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: socat
          image: alpine/socat@sha256:3ed1cd38741bd445ebffa3aecb9d80c46a83db45f5b5ef03332976c7ca9814af  # 1.8.1.3
          args:
            - TCP-LISTEN:9090,fork,reuseaddr
            - TCP:172.19.0.4:9090
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: external-prometheus
  namespace: headlamp
spec:
  selector:
    app: external-prometheus-proxy
  ports:
    - port: 9090
      targetPort: 9090
