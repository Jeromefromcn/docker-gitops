apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab-environment
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: consul
        metrics_path: /v1/agent/metrics
        params:
          format: ["prometheus"]
        static_configs:
          - targets: ["consul:8500"]

      # Business services expose Spring Boot Actuator's Prometheus endpoint.
      - job_name: spring-boot-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - "customers-service:8081"
              - "vets-service:8083"
              - "visits-service:8082"
              - "api-gateway:8080"
            labels:
              env: lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: lab-environment
data:
  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 24h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: lab-environment
data:
  # Rewritten from the compose version: that one used docker_sd_configs +
  # /var/run/docker.sock to discover containers, which doesn't exist under
  # containerd. This version reads kubelet's standard per-pod log path
  # directly via a namespace-prefixed glob (/var/log/pods/lab-environment_*/…)
  # — no Kubernetes API access, no RBAC/ServiceAccount needed, and it
  # physically never opens another namespace's log files, which is a
  # stronger isolation guarantee than filtering after the fact with
  # kubernetes_sd_configs + relabel_configs would give.
  promtail-config.yml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: lab-environment-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: lab-environment
              namespace: lab-environment
              __path__: /var/log/pods/lab-environment_*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: '^/var/log/pods/lab-environment_(?P<pod_name>[^_]+)_[0-9a-f-]+/(?P<container_name>[^/]+)/\d+\.log$'
          - labels:
              pod_name:
              service: container_name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: lab-environment
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: lab-environment
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/json
          foldersFromFilesStructure: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: lab-environment
data:
  init-multiple-databases.sh: |
    #!/bin/bash
    # Creates one database per name in $POSTGRES_MULTIPLE_DATABASES (comma-separated),
    # owned by $POSTGRES_USER. Runs once, on first container init, via
    # docker-entrypoint-initdb.d.
    set -euo pipefail

    if [ -z "${POSTGRES_MULTIPLE_DATABASES:-}" ]; then
      exit 0
    fi

    IFS=',' read -ra DBS <<< "$POSTGRES_MULTIPLE_DATABASES"
    for db in "${DBS[@]}"; do
      echo "Creating database '$db'"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE "$db" OWNER "$POSTGRES_USER";
    EOSQL
    done
