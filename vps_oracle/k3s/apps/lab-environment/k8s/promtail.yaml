apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: lab-environment
  labels:
    app: promtail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      enableServiceLinks: false
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          args:
            - -config.file=/etc/promtail/promtail-config.yml
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/promtail-config.yml
              subPath: promtail-config.yml
            # Read-only, node-local kubelet log path. The scrape glob in
            # promtail-config.yml is prefixed /var/log/pods/lab-environment_*
            # so this pod only ever reads its own namespace's log files even
            # though the mount itself isn't namespace-scoped — see the note
            # in configmaps.yaml.
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
