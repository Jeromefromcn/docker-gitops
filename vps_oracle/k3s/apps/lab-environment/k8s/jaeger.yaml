apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: lab-environment
  labels:
    app: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 9411
              name: zipkin
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: lab-environment
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: 30095
      name: ui
    - port: 9411
      targetPort: 9411
      name: zipkin
