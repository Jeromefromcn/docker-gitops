apiVersion: apps/v1
kind: Deployment
metadata:
  name: vets-service
  namespace: lab-environment
  labels:
    app: vets-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vets-service
  template:
    metadata:
      labels:
        app: vets-service
    spec:
      enableServiceLinks: false
      containers:
        - name: vets-service
          image: ops-lab/vets-service:dev
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: SPRING_CLOUD_CONSUL_HOST
              value: "consul"
            - name: SPRING_CLOUD_CONSUL_PORT
              value: "8500"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS
              value: "true"
          ports:
            - containerPort: 8083
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vets-service
  namespace: lab-environment
spec:
  selector:
    app: vets-service
  ports:
    - port: 8083
      targetPort: 8083
