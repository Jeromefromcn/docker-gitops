apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: lab-environment
  labels:
    app: consul
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      enableServiceLinks: false
      containers:
        - name: consul
          image: hashicorp/consul:1.19
          args:
            - agent
            - -dev
            - -client=0.0.0.0
            - -ui
            # Without this, GET /v1/agent/metrics?format=prometheus 200s but
            # returns no prometheus_* series (telemetry is off by default),
            # and prometheus.yml's consul job scrapes a path that doesn't
            # exist at all otherwise — see configmaps.yaml.
            - -hcl
            - 'telemetry { prometheus_retention_time = "24h" }'
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          ports:
            - containerPort: 8500
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: lab-environment
spec:
  type: NodePort
  selector:
    app: consul
  ports:
    - port: 8500
      targetPort: 8500
      nodePort: 30092
