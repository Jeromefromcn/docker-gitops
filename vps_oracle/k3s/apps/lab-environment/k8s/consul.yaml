apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: lab-environment
  labels:
    app: consul
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      enableServiceLinks: false
      containers:
        - name: consul
          image: hashicorp/consul:1.19
          # -server + on-disk /consul/data instead of -dev: -dev keeps the KV
          # in memory and every node/consul restart wipes it, crash-looping
          # customers/vets/visits until the KV is reseeded (see README).
          args:
            - agent
            - -server
            - -bootstrap-expect=1
            - -data-dir=/consul/data
            - -client=0.0.0.0
            - -ui
            # Without this, GET /v1/agent/metrics?format=prometheus 200s but
            # returns no prometheus_* series (telemetry is off by default),
            # and prometheus.yml's consul job scrapes a path that doesn't
            # exist at all otherwise — see configmaps.yaml.
            - -hcl
            - 'telemetry { prometheus_retention_time = "24h" }'
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          ports:
            - containerPort: 8500
          volumeMounts:
            - name: consul-data
              mountPath: /consul/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: consul-data
          persistentVolumeClaim:
            claimName: consul-data
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: lab-environment
spec:
  type: NodePort
  selector:
    app: consul
  ports:
    - port: 8500
      targetPort: 8500
      nodePort: 30092
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: consul-data
  namespace: lab-environment
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
