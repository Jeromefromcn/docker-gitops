apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  namespace: lab-environment
  labels:
    app: customers-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        app: customers-service
    spec:
      enableServiceLinks: false
      containers:
        - name: customers-service
          image: ops-lab/customers-service:dev
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: SPRING_CLOUD_CONSUL_HOST
              value: "consul"
            - name: SPRING_CLOUD_CONSUL_PORT
              value: "8500"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS
              value: "true"
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: lab-environment
spec:
  selector:
    app: customers-service
  ports:
    - port: 8081
      targetPort: 8081
