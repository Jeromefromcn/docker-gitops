apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  namespace: lab-environment
  labels:
    app: customers-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: customers-service
    spec:
      enableServiceLinks: false
      containers:
        - name: customers-service
          image: ops-lab/customers-service:dev
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: SPRING_CLOUD_CONSUL_HOST
              value: "consul"
            - name: SPRING_CLOUD_CONSUL_PORT
              value: "8500"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS
              value: "true"
            # JVM container-detection is broken under this containerd/cgroup v2
            # (MaxHeap defaults to ~6Gi = 25% of host RAM), so the heap grows
            # past the 512Mi limit and gets OOM-killed. The apps only use
            # ~100Mi heap — pin it explicitly.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -Xms64m -XX:MaxDirectMemorySize=64m -XX:MaxRAM=512m"
            # Same native-memory overhead as visits-service (see its commit):
            # RSS sits at ~494Mi against a 512Mi limit with no margin, and
            # this cgroup had processes OOM-killed in it twice today even
            # though the container's own restart count hasn't moved — glibc's
            # default per-thread malloc arenas over-fragment native memory the
            # JVM never sees. Cap arena count instead of leaving it unbounded.
            - name: MALLOC_ARENA_MAX
              value: "2"
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          # Spring Boot startup is CPU-bound: at the old 250m limit it took
          # 61-98 s with ~half of all CFS periods throttled. The limit only
          # bites during startup; steady state sits far below it.
          # startupProbe holds readiness off until the app is actually up
          # (up to 180 s); readinessProbe then uses Spring's own readiness
          # group, so "Ready" means "serving", not "container started".
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: lab-environment
spec:
  selector:
    app: customers-service
  ports:
    - port: 8081
      targetPort: 8081
