apiVersion: v1
kind: Pod
metadata:
  name: lab-environment-migration-seed
  namespace: lab-environment
  labels:
    app: lab-environment-migration-seed
spec:
  containers:
    - name: seed
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: postgres-data
          mountPath: /dst/postgres-data
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres
