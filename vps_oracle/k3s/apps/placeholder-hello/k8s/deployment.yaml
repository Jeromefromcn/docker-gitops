apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder-hello
  namespace: workloads
  labels:
    app: placeholder-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placeholder-hello
  template:
    metadata:
      labels:
        app: placeholder-hello
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: placeholder-hello
          image: ghcr.io/jeromefromcn/placeholder-hello:438c70ed3a12d1351ab4539af61b3ecb4749f749
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
