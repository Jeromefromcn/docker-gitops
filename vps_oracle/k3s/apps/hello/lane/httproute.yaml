# vps_oracle/k3s/apps/hello/lane/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-backend-lane-route
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: hello-backend
  rules:
    - matches:
        - headers:
            - name: x-pr-lane
              value: "0"
      backendRefs:
        - name: hello-backend-lane
          port: 80
