# vps_oracle/k3s/apps/hello/k8s/backend-virtualservice.yaml
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hello-backend
  namespace: pr-lanes
spec:
  hosts:
    - hello-backend.pr-lanes.svc.cluster.local
  http:
    # Header-triggered only — see Task 3's own testing steps for why delay
    # and abort are split into separate header values instead of one.
    - match:
        - headers:
            x-fault-test:
              exact: "delay"
      fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 15s
      route:
        - destination:
            host: hello-backend.pr-lanes.svc.cluster.local
      timeout: 10s
    - match:
        - headers:
            x-fault-test:
              exact: "abort"
      fault:
        abort:
          percentage:
            value: 100
          httpStatus: 500
      route:
        - destination:
            host: hello-backend.pr-lanes.svc.cluster.local
    # Default route — no x-fault-test header. This is the sole config source
    # for default-traffic routing on this host: an HTTPRoute (backend-httproute.yaml)
    # previously duplicated this weight/timeout as a hedge, but it compiled to an
    # unconditional Envoy route that shadowed this VirtualService entirely (its
    # rules were never reached). Deleted rather than kept in sync — see Task 3
    # verification for the Envoy config-dump evidence.
    - route:
        - destination:
            host: hello-backend.pr-lanes.svc.cluster.local
          weight: 90
        - destination:
            host: hello-backend-canary.pr-lanes.svc.cluster.local
          weight: 10
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
      timeout: 10s
