apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-backend-baseline
  namespace: pr-lanes
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: hello-backend
  rules:
    - timeouts:
        request: 10s
        backendRequest: 8s
      backendRefs:
        - name: hello-backend
          port: 80
          weight: 90
        - name: hello-backend-canary
          port: 80
          weight: 10
