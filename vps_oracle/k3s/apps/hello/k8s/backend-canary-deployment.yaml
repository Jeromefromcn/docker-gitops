apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-backend-canary
  namespace: pr-lanes
  labels:
    app: hello-backend
    lane: canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hello-backend
      lane: canary
  template:
    metadata:
      labels:
        app: hello-backend
        lane: canary
      annotations:
        # sha256 of backend-canary-configmap.yaml's data["index.html"] content
        # (as rendered, not the raw YAML block) — see that file's own note and
        # frontend-deployment.yaml for the full explanation of why this exists.
        configmap-checksum: "298934fedba8a579276041523ff72986b769872fa3cb89e25cdcd5a69ac552e8"
    spec:
      serviceAccountName: hello-backend-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-backend
          # Same pinned digest as baseline (backend-deployment.yaml) — canary is
          # a content variant for testing weight routing, not a different build.
          image: ghcr.io/jeromefromcn/hello-backend@sha256:2099b54b518ce8d9f7b7c5e3e4344e564125f43b69e630d7db9dccf9855a92de
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: index-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: index-html
          configMap:
            name: hello-backend-canary-conf
