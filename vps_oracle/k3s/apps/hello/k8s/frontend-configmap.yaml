apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-frontend-conf
  namespace: pr-lanes
# NOTE: hello-frontend mounts default.conf via subPath, which kubelet never
# hot-reloads. If you edit data["default.conf"] below, you MUST also update
# the `configmap-checksum` annotation in frontend-deployment.yaml (sha256 of
# this content) so the pod template actually changes and a rollout happens —
# otherwise running pods keep serving the stale config. See frontend-deployment.yaml.
data:
  default.conf: |
    server {
        listen 8080;

        location /api {
            proxy_pass http://hello-backend.pr-lanes.svc.cluster.local/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
