apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app: homepage
    # arm64-only image; trivy's scanner defaults to amd64 and fails every
    # attempt, so opt out via operator.skipResourceByLabels in
    # vps_oracle/k3s/trivy-operator/values.yaml.
    trivy-operator.skip: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command: ["sh", "-c", "cp -r /config-src/. /config/"]
          volumeMounts:
            - name: config-src
              mountPath: /config-src
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: homepage
          image: ghcr.io/jeromefromcn/homepage@sha256:02b2641e7097b67656f8408edf01c28f2e7d6c61008ed720f888d6355a018040
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.jerome.cloudns.asia"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: config-src
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
