apiVersion: v1
kind: Pod
metadata:
  name: apprise-migration-seed
  namespace: workloads
  labels:
    app: apprise-migration-seed
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: config
          mountPath: /data
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: apprise
