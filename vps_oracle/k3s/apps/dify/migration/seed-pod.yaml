apiVersion: v1
kind: Pod
metadata:
  name: dify-migration-seed
  namespace: dify
  labels:
    app: dify-migration-seed
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: db-postgres
          mountPath: /mnt/db-postgres
        - name: pgvector
          mountPath: /mnt/pgvector
        - name: redis
          mountPath: /mnt/redis
        - name: plugin-daemon
          mountPath: /mnt/plugin-daemon
        - name: storage
          mountPath: /mnt/storage
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  volumes:
    - name: db-postgres
      persistentVolumeClaim:
        claimName: db-postgres
    - name: pgvector
      persistentVolumeClaim:
        claimName: pgvector
    - name: redis
      persistentVolumeClaim:
        claimName: redis
    - name: plugin-daemon
      persistentVolumeClaim:
        claimName: plugin-daemon
    - name: storage
      persistentVolumeClaim:
        claimName: storage
