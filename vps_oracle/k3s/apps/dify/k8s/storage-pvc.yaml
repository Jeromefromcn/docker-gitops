# Shared by api/worker/worker-beat (mirrors compose's shared /etc/dify/storage bind
# mount). RWO but mounted by three pods at once relies on all three landing on the same
# (only) node in this single-node cluster — see the phase D design doc's known limits.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage
  namespace: dify
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
