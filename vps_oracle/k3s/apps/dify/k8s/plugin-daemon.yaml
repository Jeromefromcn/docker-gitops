apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plugin-daemon
  namespace: dify
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-daemon
  namespace: dify
  labels:
    app: plugin-daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plugin-daemon
  template:
    metadata:
      labels:
        app: plugin-daemon
    spec:
      enableServiceLinks: false
      containers:
        - name: plugin-daemon
          image: langgenius/dify-plugin-daemon:0.6.1-local@sha256:fa7ad45e1b2a777cd243b902609abecb4fd924adcd13d21ef4258b5090a09be5
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: DB_HOST
              value: db-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE
              value: dify_plugin
            - name: DB_DEFAULT_DATABASE
              value: postgres
            - name: DB_SSL_MODE
              value: disable
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_USE_SSL
              value: "false"
            - name: SERVER_PORT
              value: "5002"
            - name: SERVER_KEY
              value: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
            - name: MAX_PLUGIN_PACKAGE_SIZE
              value: "52428800"
            - name: PPROF_ENABLED
              value: "false"
            - name: DIFY_INNER_API_URL
              value: "http://api:5001"
            - name: DIFY_INNER_API_KEY
              value: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
            - name: PLUGIN_REMOTE_INSTALLING_HOST
              value: "0.0.0.0"
            - name: PLUGIN_REMOTE_INSTALLING_PORT
              value: "5003"
            - name: FORCE_VERIFYING_SIGNATURE
              value: "true"
            - name: PLUGIN_WORKING_PATH
              value: /app/storage/cwd
            - name: PLUGIN_STORAGE_TYPE
              value: local
            - name: PLUGIN_STORAGE_LOCAL_ROOT
              value: /app/storage
            - name: PLUGIN_INSTALLED_PATH
              value: plugin
            - name: PLUGIN_PACKAGE_CACHE_PATH
              value: plugin_packages
            - name: PLUGIN_MEDIA_CACHE_PATH
              value: assets
          ports:
            - containerPort: 5002
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: plugin-daemon
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-daemon
  namespace: dify
spec:
  type: NodePort
  selector:
    app: plugin-daemon
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30088
