apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-beat
  namespace: dify
  labels:
    app: worker-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-beat
  template:
    metadata:
      labels:
        app: worker-beat
    spec:
      enableServiceLinks: false
      containers:
        - name: worker-beat
          image: langgenius/dify-api:1.14.2@sha256:062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: MODE
              value: beat
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: SECRET_KEY
            - name: DEPLOY_ENV
              value: PRODUCTION
            - name: LOG_LEVEL
              value: INFO
            - name: CONSOLE_WEB_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: CONSOLE_API_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: SERVICE_API_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: APP_WEB_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: FILES_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: INTERNAL_FILES_URL
              value: "http://api:5001"
            - name: ENDPOINT_URL_TEMPLATE
              value: "https://dify.jerome.cloudns.asia/e/{hook_id}"
            - name: TRIGGER_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: DB_HOST
              value: db-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE
              value: dify
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_USE_SSL
              value: "false"
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: CELERY_BROKER_URL
            - name: COMPOSE_WORKER_HEALTHCHECK_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 320Mi
            limits:
              cpu: 350m
              memory: 640Mi
