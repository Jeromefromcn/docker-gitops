apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dify
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: langgenius/dify-api:1.14.2@sha256:062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: MODE
              value: api
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: SECRET_KEY
            - name: INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: INIT_PASSWORD
            - name: DEPLOY_ENV
              value: PRODUCTION
            - name: LOG_LEVEL
              value: INFO
            - name: MIGRATION_ENABLED
              value: "true"
            - name: CONSOLE_WEB_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: CONSOLE_API_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: SERVICE_API_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: APP_WEB_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: FILES_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: INTERNAL_FILES_URL
              value: "http://api:5001"
            - name: ENDPOINT_URL_TEMPLATE
              value: "https://dify.jerome.cloudns.asia/e/{hook_id}"
            - name: TRIGGER_URL
              value: "https://dify.jerome.cloudns.asia"
            - name: DB_HOST
              value: db-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE
              value: dify
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_USE_SSL
              value: "false"
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: CELERY_BROKER_URL
            - name: VECTOR_STORE
              value: pgvector
            - name: PGVECTOR_HOST
              value: pgvector
            - name: PGVECTOR_PORT
              value: "5432"
            - name: PGVECTOR_USER
              value: postgres
            - name: PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: PGVECTOR_PASSWORD
            - name: PGVECTOR_DATABASE
              value: dify
            - name: SSRF_PROXY_HTTP_URL
              value: "http://ssrf-proxy:3128"
            - name: SSRF_PROXY_HTTPS_URL
              value: "http://ssrf-proxy:3128"
            - name: PLUGIN_DAEMON_URL
              value: "http://plugin-daemon:5002"
            - name: PLUGIN_DAEMON_KEY
              value: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
            - name: PLUGIN_REMOTE_INSTALL_HOST
              value: localhost
            - name: PLUGIN_REMOTE_INSTALL_PORT
              value: "5003"
            - name: PLUGIN_MAX_PACKAGE_SIZE
              value: "52428800"
            - name: PLUGIN_DAEMON_TIMEOUT
              value: "600.0"
            - name: INNER_API_KEY_FOR_PLUGIN
              value: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
          ports:
            - containerPort: 5001
          volumeMounts:
            - name: storage
              mountPath: /app/api/storage
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 400m
              memory: 384Mi
            limits:
              cpu: 450m
              memory: 768Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dify
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30087
