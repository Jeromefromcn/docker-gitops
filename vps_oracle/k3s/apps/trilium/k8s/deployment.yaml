apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: workloads
  labels:
    app: trilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trilium
  template:
    metadata:
      labels:
        app: trilium
    spec:
      containers:
        - name: trilium
          image: triliumnext/trilium:v0.104.1
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /home/node/trilium-data
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trilium
