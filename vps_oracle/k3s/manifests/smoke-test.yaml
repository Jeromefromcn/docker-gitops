apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-test
  namespace: workloads
  labels:
    app: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-test
  namespace: workloads
spec:
  type: NodePort
  selector:
    app: smoke-test
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Pod
metadata:
  name: netpol-tester
  namespace: workloads
  labels:
    app: netpol-tester
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: workloads
spec:
  podSelector:
    matchLabels:
      app: smoke-test
  policyTypes:
    - Ingress
