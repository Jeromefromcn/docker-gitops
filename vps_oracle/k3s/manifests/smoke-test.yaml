apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-test
  namespace: workloads
  labels:
    app: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-test
  namespace: workloads
spec:
  type: NodePort
  selector:
    app: smoke-test
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
