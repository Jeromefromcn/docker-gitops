apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registry-pr-lanes
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-ghcr-jeromefromcn-signature-pr-lanes
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - pr-lanes
      verifyImages:
        - imageReferences:
            - "ghcr.io/jeromefromcn/*"
          type: SigstoreBundle
          mutateDigest: false
          # Kyverno's verifyDigest defaults to true, which requires the Pod's
          # image field to already be pinned by digest — the main-branch
          # policy (restrict-image-registry.yaml) relies on that default
          # because baseline Deployments are hand-pinned by digest. PR-lane
          # Deployments are deliberately tag-pinned by commit SHA instead
          # (ApplicationSet's {{.head_sha}}, see the design doc's Global
          # Constraints on why a SHA tag counts as pinned) — with the
          # default verifyDigest:true, Kyverno rejects every PR-lane pod
          # with "missing digest for ...", since a tag reference never
          # carries one. Explicitly false here so Kyverno resolves the tag
          # to a digest internally for signature verification without
          # requiring one to already be present in the resource.
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    subjectRegExp: "^https://github\\.com/Jeromefromcn/docker-gitops/\\.github/workflows/[^/]+\\.yml@refs/(heads/main|pull/[0-9]+/merge)$"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
