# Unified Redis instance — shared server config.
# The superuser password and ACL users live in users.acl / .env (see compose file).
#
# --- persistence ---
# AOF for durability; RDB as snapshot. Redis 7 defaults: appendonly no.
# This is a general-purpose instance, so keep both on (AOF + RDB).
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# --- memory ---
# Cap the shared instance and evict least-recently-used keys when full.
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- safety ---
# Only listen on the docker network (the container's own interface).
bind 0.0.0.0
protected-mode yes
