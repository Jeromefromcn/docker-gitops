services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui@sha256:344f7a68a91e59d592fc355d67e32d8c2041b1c2082a7eaa3c413dc3a5cab7db
    container_name: 3x-ui
    hostname: 3x-ui
    restart: unless-stopped          # 重启/崩溃自动拉起
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 39876 && nc -z 127.0.0.1 46213 && nc -z 127.0.0.1 51234 && pgrep -f xray-linux-arm64 > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    tty: true
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      TZ: "Asia/Hong_Kong"           # 容器时区:香港 (UTC+8)
    volumes:
      - /etc/x-ui/db:/etc/x-ui/       # 面板数据库持久化
      - /etc/x-ui/cert:/root/cert/    # 证书持久化
      - /etc/x-ui/xray/xray-linux-arm64:/app/bin/xray-linux-arm64:ro  # 固定 Xray 26.6.27
    ports:
      - "39876:39876"                 # 节点端口(VLESS + Reality),客户端直连,必须留在宿主机
      # 面板 46213、订阅服务 51234 不再发布到宿主机,改走 NPM 反代:
      # https://panel.3x.jerome.cloudns.asia / https://sub.3x.jerome.cloudns.asia
    networks:
      - proxy

networks:
  proxy:
    external: true   # 手动创建一次：docker network create proxy
