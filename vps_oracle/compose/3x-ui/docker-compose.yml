services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui@sha256:344f7a68a91e59d592fc355d67e32d8c2041b1c2082a7eaa3c413dc3a5cab7db
    container_name: 3x-ui
    hostname: 3x-ui
    restart: unless-stopped          # auto-restart on reboot/crash
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 39876 && nc -z 127.0.0.1 46213 && nc -z 127.0.0.1 51234 && pgrep -f xray-linux-arm64 > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    tty: true
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      TZ: "Asia/Hong_Kong"           # container timezone: Hong Kong (UTC+8)
    volumes:
      - /etc/x-ui/db:/etc/x-ui/       # panel database persistence
      - /etc/x-ui/cert:/root/cert/    # certificate persistence
      - /etc/x-ui/xray/xray-linux-arm64:/app/bin/xray-linux-arm64:ro  # pin Xray 26.6.27
    ports:
      - "39876:39876"                 # node port (VLESS + Reality), clients connect directly, must stay on the host
      # The panel (46213) and subscription service (51234) are no longer published to the
      # host — they now go through the NPM reverse proxy:
      # https://panel.3x.jerome.cloudns.asia / https://sub.3x.jerome.cloudns.asia
    networks:
      proxy:
        ipv4_address: 172.19.0.2  # pinned static IP: xray's own DNS hosts override (in config.json,
                                   # domain:jerome.cloudns.asia -> npm's 172.19.0.3) makes proxied
                                   # *.jerome.cloudns.asia traffic go straight to npm inside the proxy
                                   # network, without leaving the host or getting its source SNAT-
                                   # rewritten — so nginx sees the source as this 3x-ui container's
                                   # own IP, which is exactly the address NPM's access list allows

networks:
  proxy:
    external: true   # create once manually: docker network create proxy
