services:
  plans:
    image: plans:1478db4
    container_name: plans
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    networks:
      - proxy
    # NPM reverse proxy: plans.jerome.cloudns.asia → plans:80, access list=self-only.
    # For configuration see the "Reverse-proxy the service via NPM" section of README.md.

networks:
  proxy:
    external: true
