services:
  trilium:
    image: triliumnext/trilium:v0.104.1@sha256:3332fa03198f0b3ecddf11fcf37f3aace352a664728d669a1ffa7a5594a6f2d6
    container_name: trilium
    hostname: trilium
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - /etc/trilium/data:/home/node/trilium-data
    networks:
      - proxy
    # NPM 反代配置: Forward Hostname/IP = trilium, Forward Port = 8080（未发布到宿主机）

networks:
  proxy:
    external: true
