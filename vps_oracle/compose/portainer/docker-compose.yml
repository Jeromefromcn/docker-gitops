services:
  portainer:
    image: portainer/portainer-ce@sha256:707366c811956fe077135a6633af67e698529612869711cdb24896c892b28feb  # 2.43.0
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # required: controls the host docker, equivalent to root, a known and unavoidable risk
      - /etc/portainer/data:/data                     # Portainer's own database persistence (stack definitions also live here, unlike Dockge which needs the host compose directory mounted)
      # The image ships no tzdata and no /etc/localtime, so the TZ variable above
      # resolves to nothing and Go silently falls back to UTC. Bind-mounting the
      # single zone file (1.2 KB) is what actually makes TZ take effect.
      # Note: mounting /etc/localtime instead would NOT work — once TZ is set to a
      # zone name, Go only looks it up under /usr/share/zoneinfo and ignores /etc/localtime.
      - /usr/share/zoneinfo/Asia/Hong_Kong:/usr/share/zoneinfo/Asia/Hong_Kong:ro
    networks:
      - proxy
    # NPM reverse proxy: Forward Hostname/IP = portainer, Forward Port = 9000 (HTTP UI, not published to the host; 9443 is its built-in HTTPS, left unused since NPM handles all TLS)

networks:
  proxy:
    external: true   # create once manually: docker network create proxy
