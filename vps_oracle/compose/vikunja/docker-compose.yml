services:
  vikunja:
    image: vikunja/vikunja:2.4.0
    container_name: vikunja
    hostname: vikunja
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env   # needs a line VIKUNJA_SERVICE_SECRET=<value>
    environment:
      TZ: "Asia/Hong_Kong"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_PUBLICURL: "https://vikunja.jerome.cloudns.asia"
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_OUTGOINGREQUESTS_ALLOWNONROUTABLEIPS: "true"
    volumes:
      - /etc/vikunja/files:/app/vikunja/files
      - /etc/vikunja/db:/db
    networks:
      - proxy
    # NPM reverse proxy: Forward Hostname/IP = vikunja, Forward Port = 3456 (not published to the host)

  vikunja-notify-relay:
    image: ghcr.io/jeromefromcn/vikunja-notify-relay@sha256:163e88a174aad5e477e475d8d5d4f2dea66f44de08ecf0ea0771ff24327214b7
    container_name: vikunja-notify-relay
    hostname: vikunja-notify-relay
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
      VIKUNJA_BASE_URL: "https://vikunja.jerome.cloudns.asia"
      APPRISE_BASE_URL: "http://apprise:8000"
      PORT: "8080"
    networks:
      - proxy
    # Pure internal glue service: receives the Vikunja webhook, assembles an HTML message with
    # the project/task/hyperlink, and forwards it to apprise. No NPM and no published port —
    # only reached by container name from vikunja within the proxy network. See notify-relay/app.py.

networks:
  proxy:
    external: true
