services:
  vikunja:
    image: vikunja/vikunja:2.4.0
    container_name: vikunja
    hostname: vikunja
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env   # 需要一行 VIKUNJA_SERVICE_SECRET=<openssl rand -hex 32>，本目录下已生成，不提交
    environment:
      TZ: "Asia/Hong_Kong"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_PUBLICURL: "https://vikunja.jerome.cloudns.asia"
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      # 允许 webhook 投递到 proxy 网络内部的 apprise 容器（私网段），否则被 Vikunja 自带 SSRF 防护拦截
      VIKUNJA_OUTGOINGREQUESTS_ALLOWNONROUTABLEIPS: "true"
    volumes:
      - /etc/vikunja/files:/app/vikunja/files
      - /etc/vikunja/db:/db
    networks:
      - proxy
    # NPM 反代配置: Forward Hostname/IP = vikunja, Forward Port = 3456（未发布到宿主机）

  vikunja-notify-relay:
    build: ./notify-relay
    image: vikunja-notify-relay:1.0.0
    container_name: vikunja-notify-relay
    hostname: vikunja-notify-relay
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
      VIKUNJA_BASE_URL: "https://vikunja.jerome.cloudns.asia"
      APPRISE_NOTIFY_URL: "http://apprise:8000/notify/vikunja-tg"
      PORT: "8080"
    networks:
      - proxy
    # 纯内部 glue 服务：接 Vikunja webhook，拼好 project/task/超链接的 HTML 消息后转发给 apprise。
    # 不接 NPM、不发布端口，只在 proxy 网络内被 vikunja 用容器名访问。见 notify-relay/app.py。

networks:
  proxy:
    external: true   # 手动创建一次：docker network create proxy
