services:
  app:
    image: 'jc21/nginx-proxy-manager:2.15.1' # Pinned version, stable and no gotchas. Upgraded from 2.12.3 on 2026-08-21 for two reasons:
                                             # 1) The Dashboard's Proxy Hosts count only counts hosts owned by the current logged-in user
                                             #    (report.js writes permission_visibility as visibility, so it's always
                                             #    undefined and thus always filters by owner), so hosts created with the
                                             #    automation account aren't counted; the upstream fixed it in 2.14.0. The
                                             #    list page was always correct, only the homepage number was wrong.
                                             # 2) 2.15.0 fixed the privilege escalation where any authenticated user could
                                             #    change their own roles field via PUT — directly affecting the claude
                                             #    account in .npm-automation.env that was supposed to be least-privileged.
                                             #    Also includes an OpenResty CVE fix.
    container_name: npm
    hostname: npm
    restart: unless-stopped          # won't come back after a host reboot if manually stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - '80:80'
      - '443:443'
      # 81 (admin panel) is not published to the host; access it via https://npm.jerome.cloudns.asia;
      # in an emergency, SSH to the server and use a tunnel over the container's internal IP
    environment:
      TZ: "Asia/Hong_Kong" # keep the timezone consistent so log timestamps are accurate
    volumes:
      - /etc/npm/data:/data           # panel data persistence (absolute path, unaffected if the repo directory moves)
      - /etc/npm/letsencrypt:/etc/letsencrypt  # certificate persistence
    networks:
      proxy:
        ipv4_address: 172.19.0.3  # pinned static IP: 3x-ui's xray has a DNS hosts override rule
                                   # (domain:jerome.cloudns.asia -> 172.19.0.3) that sends the proxied
                                   # *.jerome.cloudns.asia traffic to this IP inside the proxy network —
                                   # it must be fixed and equal to npm's own address, otherwise the
                                   # proxied traffic gets routed to the wrong place
    extra_hosts:
      # Purpose: only for in-container shell debugging (e.g. docker exec npm curl/wget host.docker.internal:30080),
      # resolved via glibc /etc/hosts, so you don't need to remember the IP when troubleshooting host
      # connectivity from inside the container. Unrelated to NPM's actual reverse-proxy traffic — the
      # proxy_pass config nginx generates uses Docker's built-in DNS resolver (127.0.0.11) for dynamic
      # resolution and doesn't read /etc/hosts/extra_hosts, so when configuring a reverse proxy to a host
      # port in the NPM panel (e.g. a k3s NodePort), the Forward Hostname/IP must be the host's internal
      # IP (e.g. 10.0.0.95) directly, not host.docker.internal, otherwise it errors with
      # "could not be resolved" and returns 502.
      # Another gotcha: you can't replace this IP with the `host-gateway` magic value — it resolves to the
      # docker0 bridge gateway 172.17.0.1, but the Cilium kube-proxy replacement NodePort eBPF programs are
      # bound only to the actual NIC enp0s6 (the node's internal IP, see the KubeProxyReplacement Device in
      # `cilium status --verbose`); even a curl from the host itself to 172.17.0.1:30080 won't connect, so
      # you must point directly at that internal IP. This IP is DHCP-assigned (`ip -4 addr show enp0s6`
      # shows dynamic) — if Oracle changes the address, NPM reverse proxies to NodePort services will
      # silently turn into 502; check whether this IP changed first before troubleshooting anything else.
      - "host.docker.internal:10.0.0.95"

networks:
  proxy:
    external: true   # create once manually: docker network create proxy