services:
  app:
    image: 'jc21/nginx-proxy-manager:2.12.3' # 固定版本，稳定不踩坑
    container_name: npm
    hostname: npm
    restart: unless-stopped          # 手动停止后不会随宿主机重启被拉起
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - '80:80'
      - '443:443'
      # 81（管理面板）不发布到宿主机，走 https://npm.jerome.cloudns.asia 访问；
      # 应急时 SSH 到服务器用容器内部 IP 隧道访问
    environment:
      TZ: "Asia/Hong_Kong" # 保持时区一致，日志时间才准确
    volumes:
      - /etc/npm/data:/data           # 面板数据持久化（绝对路径，仓库目录搬家不受影响）
      - /etc/npm/letsencrypt:/etc/letsencrypt  # 证书持久化
    networks:
      proxy:
        ipv4_address: 172.19.0.3  # 钉死静态 IP：3x-ui 的 xray 有条 DNS hosts 覆写规则
                                   # （domain:jerome.cloudns.asia -> 172.19.0.3），把代理进来的
                                   # *.jerome.cloudns.asia 流量直接在 proxy 网络内部转给这个 IP，
                                   # 必须固定等于 npm 自己的位址，不然代理进来的流量会被送错地方
    extra_hosts:
      # 用途：仅供容器内 shell 调试用（如 docker exec npm curl/wget host.docker.internal:30080），
      # 走 glibc 解析 /etc/hosts，方便进容器排查宿主机连通性时不用记 IP。
      # 跟 NPM 实际反代流量无关 —— nginx 生成的 proxy_pass 配置走 Docker 内嵌 DNS resolver
      # （127.0.0.11）动态解析，不读 /etc/hosts/extra_hosts，所以 NPM 面板里配置反代到
      # 宿主机端口（如 k3s NodePort）时，Forward Hostname/IP 必须直接填宿主机内网 IP
      # （如 10.0.0.95），不能填 host.docker.internal，否则报 "could not be resolved" 导致 502。
      # 另一个坑：不能用 `host-gateway` 魔法值代替这个 IP —— 它解析到 docker0 网桥网关
      # 172.17.0.1，但 Cilium kube-proxy replacement 的 NodePort eBPF 程序只绑定在实际
      # 网卡 enp0s6（节点内网 IP，见 `cilium status --verbose` 的 KubeProxyReplacement
      # Device），连宿主机本机 curl 172.17.0.1:30080 都连不通，必须直接指向该内网 IP。
      # 这个 IP 是 DHCP 分配的（`ip -4 addr show enp0s6` 显示 dynamic）——如果 Oracle
      # 换了地址，NPM 反代到 NodePort 的服务会静默变成 502，先查这个 IP 有没有变，
      # 再排查别的。
      - "host.docker.internal:10.0.0.95"

networks:
  proxy:
    external: true   # 手动创建一次：docker network create proxy
