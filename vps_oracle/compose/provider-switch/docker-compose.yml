services:
  provider-switch:
    build: .
    image: provider-switch:1.0.0
    container_name: provider-switch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    user: "1001:1001"   # 需要以宿主机 ubuntu 用户写 ~/.claude-provider/ 下的文件，不能用 nobody
    # network_mode: host（而不是加入 proxy 网络）：status.check_connectivity()
    # 探测的是 bridget.env 里的 http://127.0.0.1:3456，这是 CCR 网关（Task 5）
    # 特意只绑定宿主机 loopback 的地址——容器如果只挂在 proxy 这种 bridge
    # 网络上，127.0.0.1 指向的是容器自己的 loopback，永远探测不到宿主机上的
    # CCR，导致健康列一直显示 UNREACHABLE（哪怕 CCR 其实是好的）。改
    # host 网络后容器的网络栈就是宿主机本身，127.0.0.1 才能正确解析到宿主机。
    # 副作用：不能再用 hostname/networks，也不再挂 proxy 网络；app.py 相应把
    # 监听地址从 0.0.0.0 收紧成 127.0.0.1（宿主机 loopback-only），维持最小
    # 暴露——Task 10 要接 NPM 反代时得另外决定怎么从 NPM 容器打进来（NPM 不在
    # host 网络里，打不到宿主机的 127.0.0.1），不是这次改动要解决的问题。
    network_mode: host
    environment:
      TZ: "Asia/Hong_Kong"
      PORT: "8091"   # 8080 在宿主机上已经被 programming-learning-platform-nginx-1 占用（host 网络下端口是宿主机全局共享的）
      BIND_HOST: "127.0.0.1"
      CCR_BASE_URL: "http://127.0.0.1:3456"
      CCR_TOKEN: "${CCR_CLIENT_TOKEN}"   # Task 6 生成的 CCR client key，走 .env
    env_file:
      - .env
    volumes:
      - /home/ubuntu/.claude-provider:/home/ubuntu/.claude-provider
    # NPM 反代配置见 vps_oracle/compose/ccr/README.md 里的 "接入 NPM" 一节
    # （Task 10 待办：host 网络下 NPM 需要打宿主机真实 IP，不能走容器名）
