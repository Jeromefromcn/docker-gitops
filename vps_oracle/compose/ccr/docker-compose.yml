services:
  ccr:
    build:
      context: https://github.com/musistudio/claude-code-router.git#v3.0.20
    image: claude-code-router:3.0.20   # built from a pinned git tag; the upstream publishes no image, so this is the equivalent of "version pinning"
    container_name: ccr
    hostname: ccr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env   # needs CCR_WEB_AUTH_TOKEN (the admin panel / RPC password) and ZHIPU_API_KEY (the Zhipu key), see .env.example
    environment:
      TZ: "Asia/Hong_Kong"
      CCR_PUBLIC_BASE_URL: "http://127.0.0.1:3458"
      # Load the SSE delta coalescing middleware into every node process in the
      # container (core server, gateway child, etc.) (/data is a persistent volume).
      # Upstreams like Zhipu emit SSE deltas at token granularity; forwarding them
      # event by event blows up the VS Code extension's remote rendering pipeline,
      # see the header comment in sse-coalesce.cjs.
      # The same mechanism also mounts export-model-routing.cjs: it exports each
      # claude-code profile's model routing strings (containing no keys) to
      # /model-routing/routing.json for switchboard to consume via a read-only
      # mount, implementing opus/sonnet/haiku tier routing. See the header comment
      # in export-model-routing.cjs and
      # docs/misc/2026-08-20-ccr-third-party-model-compat-lessons.md.
      # It also mounts patch-subagent-routing.cjs: before the gateway loads, this
      # fixes the bug in server.js where subagent requests are force-routed to the
      # profile's default model (flash). It is a runtime self-healing patch — the
      # first node process after an image rebuild re-applies it, and it does not
      # depend on any state inside the image. See
      # docs/incidents/2026-08-30-ccr-subagent-flash-routing.md.
      NODE_OPTIONS: "--require /data/.claude-code-router/sse-coalesce.cjs --require /data/.claude-code-router/export-model-routing.cjs --require /data/.claude-code-router/patch-subagent-routing.cjs"
      # Coalescing window (milliseconds). Zhipu emits one delta every 25-50ms, and a
      # 40ms window often catches only 1-2, giving an actual merge ratio of just
      # 3-5x; enlarging the window plus a dedicated large thinking window (thinking
      # is ~99% of events and its display smoothness doesn't matter) raises the merge
      # ratio to 15-30x, cutting the extension's ask latency from 3min to <1min.
      # Per-type knobs that are unset / set to 0 fall back to the global value;
      # CCR_SSE_COALESCE_MS=0 disables the whole thing.
      CCR_SSE_COALESCE_MS: "200"
      CCR_SSE_COALESCE_THINKING_MS: "500"
      CCR_SSE_COALESCE_TEXT_MS: "120"
    ports:
      # Exception: the claude process runs on the host, not in a container, so it
      # can't reach the proxy network and can only use published host ports.
      # Both ports are bound only to 127.0.0.1 and are not exposed externally; to
      # reach the admin panel (3458) from another machine, use SSH port forwarding.
      #
      # There is a single public entry point inside the container: nginx listens on
      # 8080 and forwards by URL path to the container's internal, private gateway
      # (127.0.0.1:3456) or management RPC (127.0.0.1:3459) — see the nginx server
      # block generated by upstream v3.0.20's docker/entrypoint.sh. So both host
      # ports point at the container's 8080 — not two different container ports —
      # and nginx itself routes by path (/v1/*, /messages etc. go to the gateway,
      # /, /api/ccr/rpc go to the admin panel), regardless of which host port the
      # request came in on.
      - "127.0.0.1:3456:8080"   # gateway; the ANTHROPIC_BASE_URL in jerome/bridget's .env files points here
      - "127.0.0.1:3458:8080"   # management UI/RPC
    volumes:
      - ccr-data:/data   # holds SQLite config + API keys + logs — sensitive state, so deliberately not a repo-visible bind mount
      # The SSE delta coalescing middleware code is committed to the repo and mounted
      # read-only into /data, version-controlled with the repo. The core rebuilds
      # gateway-proxy-preload.cjs on every start, so the middleware does not go through
      # preload but is loaded directly via the NODE_OPTIONS --require above (it calls
      # install() on module load).
      - ./sse-coalesce.cjs:/data/.claude-code-router/sse-coalesce.cjs:ro
      - ./export-model-routing.cjs:/data/.claude-code-router/export-model-routing.cjs:ro
      - ./patch-subagent-routing.cjs:/data/.claude-code-router/patch-subagent-routing.cjs:ro
      # Landing directory for the exported files — deliberately not inside the
      # ccr-data volume above: that volume (including config.sqlite) has directory
      # permissions 700 root:root, so other containers can't read it even when mounted;
      # here we carve out a separate non-sensitive bind mount holding only the model
      # routing strings, with no keys. switchboard consumes it via a read-only mount of
      # the same host directory.
      - ./model-routing:/model-routing
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  ccr-data: