services:
  ccr:
    build:
      context: https://github.com/musistudio/claude-code-router.git#v3.0.20
    image: claude-code-router:3.0.20   # 构建自 pin 死的 git tag；上游没有发布镜像，这是等价的"锁版本"
    container_name: ccr
    hostname: ccr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env   # 需要 CCR_WEB_AUTH_TOKEN（管理面板/RPC 口令）和 ZHIPU_API_KEY（智谱 key），见 .env.example
    environment:
      TZ: "Asia/Hong_Kong"
      CCR_PUBLIC_BASE_URL: "http://127.0.0.1:3458"
      # 让容器内所有 node 进程（core server、gateway child 等）都加载 SSE delta
      # 合併中间件（/data 是持久卷）。Zhipu 等上游按 token 粒度发 SSE delta，
      # 逐事件转发会打爆 VS Code 扩展的远程渲染管线，见 sse-coalesce.cjs 头注。
      # 同样机制再挂一个 export-model-routing.cjs：把 claude-code 各 profile
      # 的模型路由字符串（不含任何 key）导出到 /model-routing/routing.json，
      # 供 switchboard 只读挂载消费，实现 opus/sonnet/haiku 分档路由。见
      # export-model-routing.cjs 头注 和
      # docs/misc/2026-08-20-ccr-third-party-model-compat-lessons.md。
      # 再挂 patch-subagent-routing.cjs：在 gateway 加载前修掉 server.js 里
      # subagent 请求被强制路由到 profile 默认 model(flash) 的 bug。它是运行时
      # 自愈补丁——镜像重建后第一个 node 进程会重新打上，不依赖镜像内状态。见
      # docs/incidents/2026-08-30-ccr-subagent-flash-routing.md。
      NODE_OPTIONS: "--require /data/.claude-code-router/sse-coalesce.cjs --require /data/.claude-code-router/export-model-routing.cjs --require /data/.claude-code-router/patch-subagent-routing.cjs"
      # 合併窗口（毫秒）。Zhipu 每 25-50ms 吐一个 delta，40ms 窗口常只抓到 1-2 个，
      # 實測合併率僅 3-5x；加大窗口 + thinking 專用大窗口（thinking 佔事件 ~99%
      # 且顯示平滑度無關緊要）可把合併率提到 15-30x，擴展提問延遲 3min → <1min。
      # 未設/設 0 的 per-type knob 回落到全局值；CCR_SSE_COALESCE_MS=0 整體禁用。
      CCR_SSE_COALESCE_MS: "200"
      CCR_SSE_COALESCE_THINKING_MS: "500"
      CCR_SSE_COALESCE_TEXT_MS: "120"
    ports:
      # 例外：claude 进程跑在宿主机上、不在容器里，够不到 proxy 网络，只能发布到宿主机端口。
      # 两个端口都只绑 127.0.0.1，不对外暴露；管理面板(3458)如需从别的机器访问，走 SSH 端口转发。
      #
      # 容器内只有一个公开入口：nginx 监听 8080，按 URL 路径转发到容器内部私有的
      # gateway(127.0.0.1:3456) 或 management RPC(127.0.0.1:3459)，见上游 v3.0.20
      # docker/entrypoint.sh 生成的 nginx server block。所以两条宿主机端口都指向
      # 容器的 8080——不是两个不同的容器端口——nginx 自己按路径（/v1/*、/messages 等
      # 走 gateway，/、/api/ccr/rpc 走管理面板）分流，跟请求从哪个宿主机端口进来无关。
      - "127.0.0.1:3456:8080"   # gateway，jerome/bridget 的 .env 文件里 ANTHROPIC_BASE_URL 指这里
      - "127.0.0.1:3458:8080"   # management UI/RPC
    volumes:
      - ccr-data:/data   # 装 SQLite 配置 + API key + 日志，属于敏感状态，故意不用仓库内可见的 bind mount
      # SSE delta 合併中间件代码已入库，只读挂载到 /data 随仓库走版本控制。
      # core 每次启动会重建 gateway-proxy-preload.cjs，所以中间件不走 preload，
      # 而是经上面 NODE_OPTIONS --require 直挂（模块加载时自调用 install()）。
      - ./sse-coalesce.cjs:/data/.claude-code-router/sse-coalesce.cjs:ro
      - ./export-model-routing.cjs:/data/.claude-code-router/export-model-routing.cjs:ro
      - ./patch-subagent-routing.cjs:/data/.claude-code-router/patch-subagent-routing.cjs:ro
      # 导出文件的落地目录——刻意不放在上面 ccr-data 卷里：那个卷（含
      # config.sqlite）目录权限是 700 root:root，其他容器挂了也读不到；这里
      # 单独开一个非敏感的 bind mount，只装模型路由字符串，不含任何 key。
      # switchboard 那边只读挂载同一个宿主机目录消费。
      - ./model-routing:/model-routing
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  ccr-data:
