services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env   # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (gitignored, not committed)
    environment:
      TZ: "Asia/Hong_Kong"
    command: server /data --console-address ":9001"
    volumes:
      - /etc/minio/data:/data
    networks:
      - proxy
    # NPM reverse proxy: Forward Hostname/IP = minio, Forward Port = 9001 (console, not published to the host).
    # 9000 (S3 API) is neither published nor reverse-proxied — purely internal; open it up when external S3 is needed.

networks:
  proxy:
    external: true
