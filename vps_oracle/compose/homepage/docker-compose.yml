services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.0.0@sha256:638dacf5c844e908dc06c1fd57a2b5694f8efd91f91f152829ea0c2f547458f2
    container_name: homepage
    hostname: homepage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
      HOMEPAGE_ALLOWED_HOSTS: "homepage.jerome.cloudns.asia"  # must match the domain used to access it, otherwise 403
    volumes:
      - ./config:/app/config
    networks:
      - proxy
    # NPM reverse proxy: Forward Hostname/IP = homepage, Forward Port = 3000 (not published to the host)

networks:
  proxy:
    external: true
