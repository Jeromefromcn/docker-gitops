services:
  apprise:
    image: caronc/apprise:v1.5.1
    container_name: apprise
    hostname: apprise
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
      APPRISE_STATEFUL_MODE: "simple"
      APPRISE_WORKER_COUNT: "1"
      APPRISE_ADMIN: "y"
    volumes:
      - /etc/apprise/config:/config
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - proxy
    # NPM 反代配置: Forward Hostname/IP = apprise, Forward Port = 8000（容器名直连，走 proxy 网络）
    # 127.0.0.1:8000 是给 host-native 脚本用的（inspector 巡检脚本不在任何 docker network 里，
    # 见 vps_oracle/inspector/lib/common.sh 的 APPRISE_URL），只绑 localhost，不对外网暴露。

networks:
  proxy:
    external: true
