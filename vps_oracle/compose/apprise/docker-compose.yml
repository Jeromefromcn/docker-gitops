services:
  apprise:
    image: caronc/apprise:v1.5.1
    container_name: apprise
    hostname: apprise
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
      APPRISE_STATEFUL_MODE: "simple"
      APPRISE_WORKER_COUNT: "1"
      APPRISE_ADMIN: "y"
    volumes:
      - /etc/apprise/config:/config
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - proxy
    # NPM reverse proxy: Forward Hostname/IP = apprise, Forward Port = 8000 (container name direct, over the proxy network)
    # 127.0.0.1:8000 is for the host-native scripts (the inspector checks aren't on any docker
    # network; see APPRISE_URL in vps_oracle/host-native/inspector/lib/common.sh) — bound to
    # localhost only, not exposed to the outside network.

networks:
  proxy:
    external: true
