# Read-only markdown viewer for the private job-search repo.
# Serves only: the static front end, directory listings (JSON), and *.md files.
server {
    listen 8080;

    location = / {
        root /srv/site;
        try_files /index.html =404;
    }

    location ^~ /files/ {
        root /srv;

        location ~ /$ {
            autoindex on;
            autoindex_format json;
        }

        location ~ \.md$ {
        }

        return 404;
    }
}
