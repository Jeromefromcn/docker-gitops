global:
  scrape_interval: 60s

scrape_configs:
  - job_name: node_oracle
    # Fixed `instance` labels (host names instead of the raw scrape address) so the
    # dashboards' Instance dropdown reads the same for all three hosts.
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: vps-oracle
      # vps_oracle2's node-exporter over the tailscale mesh (tag:oracle-hub -> tag:oracle2),
      # see vps_oracle2/compose/node-exporter/docker-compose.yml. Shares this job so the
      # node-exporter-full-oracle dashboard (job is a constant) lists it in its Nodename
      # dropdown. Default 60s interval is fine: OCI egress isn't metered like GCP's 1GB.
      - targets: ['100.100.140.33:9100']
        labels:
          instance: vps-oracle2

  # vps_gcp's node-exporter, reached over the oracle<->gcp tailscale mesh (confirmed
  # reachable directly from this container, no extra routing needed). See
  # vps_gcp/compose/node-exporter/docker-compose.yml. scrape_interval overridden to 15m
  # (vs. the 60s global default) because this scrape's response body egresses from GCP's
  # side of the tailscale link, counted against its 1GB/month free-tier network egress —
  # at 60s this job alone would use ~500MB/month, at 15m it's ~33MB/month.
  - job_name: node_gcp
    scrape_interval: 15m
    static_configs:
      - targets: ['100.96.184.44:9100']
        labels:
          instance: vps-gcp

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: blackbox_exporter_self
    static_configs:
      - targets: ['blackbox-exporter:9115']

  - job_name: blackbox_http_2xx
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://npm.jerome.cloudns.asia
          - https://portainer.jerome.cloudns.asia/
          - https://argocd.jerome.cloudns.asia
          - https://headlamp.jerome.cloudns.asia
          - https://homepage.jerome.cloudns.asia
          - https://plans.jerome.cloudns.asia
          - https://trilium.jerome.cloudns.asia
          - https://vikunja.jerome.cloudns.asia
          # lab-environment end-to-end, via vps-oracle2's own NodePort over
          # tailscale (see probe_lab_api in grafana probe-rules.yml)
          - http://100.100.140.33:30097/api/vet/vets
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_http_2xx_or_404
    metrics_path: /probe
    params:
      module: [http_2xx_or_404]
    static_configs:
      - targets:
          - https://panel.3x.jerome.cloudns.asia
          - https://sub.3x.jerome.cloudns.asia/sub/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Basic-Auth-fronted NPM hosts (apprise/ccr/switchboard) — accept 401 as success
  - job_name: blackbox_http_2xx_or_404_or_401
    metrics_path: /probe
    params:
      module: [http_2xx_or_404_or_401]
    static_configs:
      - targets:
          - https://apprise.jerome.cloudns.asia
          - https://ccr.jerome.cloudns.asia
          - https://switchboard.jerome.cloudns.asia
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - jerome.cloudns.asia:39876
          # vps-oracle2 k3s agent kubelet, over tailscale
          - 100.100.140.33:10250
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: istiod
    static_configs:
      - targets: ['10.0.0.95:30110']

  - job_name: ztunnel
    static_configs:
      - targets: ['10.0.0.95:30111']

  - job_name: waypoint
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ['10.0.0.95:30112']
