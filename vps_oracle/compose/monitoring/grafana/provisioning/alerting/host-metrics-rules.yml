apiVersion: 1

groups:
  - orgId: 1
    name: host_metrics
    folder: Monitoring
    interval: 60s
    rules:
      - uid: cpu_warning
        title: CPU Usage Warning
        condition: B
        for: 15m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 75% for 15 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [75]

      - uid: cpu_critical
        title: CPU Usage Critical
        condition: B
        for: 10m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "CPU usage above 90% for 10 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]

      - uid: memory_warning
        title: Memory Usage Warning
        condition: B
        for: 15m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 80% for 15 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]

      - uid: memory_critical
        title: Memory Usage Critical
        condition: B
        for: 10m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "Memory usage above 90% for 10 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]

      - uid: disk_warning
        title: Disk Usage Warning
        condition: B
        for: 0m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 75% on vps_oracle root filesystem"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}))'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [75]

      - uid: disk_critical
        title: Disk Usage Critical
        condition: B
        for: 0m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 85% on vps_oracle root filesystem"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}))'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]

      - uid: load_warning
        title: Load Average Warning
        condition: B
        for: 15m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "Load average (5m) above 1.0 per core for 15 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'node_load5 / count(count(node_cpu_seconds_total) by (cpu))'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]

      - uid: load_critical
        title: Load Average Critical
        condition: B
        for: 10m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "Load average (5m) above 2.0 per core for 10 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'node_load5 / count(count(node_cpu_seconds_total) by (cpu))'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]

      # Added 2026-08-15 after the vscode-server session pileup incident
      # (docs/incidents/2026-08-15-vscode-sessions-resource-spike.md).
      # Static CPU/mem/disk/load thresholds only caught the 11-minute ignition;
      # nothing was watching the 20-hour accumulation. PSI, blocked-process count,
      # swap, and the memory trend rule below close that gap.

      - uid: io_pressure_warning
        title: IO Pressure Warning
        condition: B
        for: 3m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "IO PSI 'some' above 20% for 3 minutes on vps_oracle (processes waiting on IO)"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'rate(node_pressure_io_waiting_seconds_total[5m]) * 100'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]

      - uid: io_pressure_critical
        title: IO Pressure Critical
        condition: B
        for: 2m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "IO PSI 'full' above 15% for 2 minutes on vps_oracle (processes stalled on IO, load average will follow)"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'rate(node_pressure_io_stalled_seconds_total[5m]) * 100'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [15]

      - uid: memory_pressure_critical
        title: Memory Pressure Critical
        condition: B
        for: 2m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "Memory PSI 'full' above 5% for 2 minutes on vps_oracle (kernel hard-reclaiming page cache)"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'rate(node_pressure_memory_stalled_seconds_total[5m]) * 100'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: blocked_procs_warning
        title: Blocked Processes Warning
        condition: B
        for: 2m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 3 processes in uninterruptible IO wait (D state) for 2 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'node_procs_blocked'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]

      # 2026-08-16: swap level alone is a poor pressure signal on this host -
      # the kernel proactively swaps idle anonymous pages (swappiness=60), so
      # swap sits at ~50% while RAM is plentiful. Only alert when swap is high
      # AND available memory is actually tight. (swappiness lowered to 10 so
      # swap now stays near-empty in normal operation.)
      - uid: swap_warning
        title: Swap Usage Warning
        condition: D
        for: 15m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "Swap usage above 50% while available memory below 15% for 15 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 * (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes))'
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              instant: true
              expr: '100 * (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)'
          - refId: C
            datasourceUid: '__expr__'
            model:
              refId: C
              type: math
              expression: '$A > 50 && $B < 15'
          - refId: D
            datasourceUid: '__expr__'
            model:
              refId: D
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]

      - uid: swap_critical
        title: Swap Usage Critical
        condition: B
        for: 10m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "Swap usage above 80% for 10 minutes on vps_oracle"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: '100 * (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes))'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]

      - uid: swap_absent_critical
        title: Swap Absent
        condition: B
        for: 15m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "No swap configured on vps_oracle (SwapTotal is 0) - memory pressure will convert straight into an IO storm"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'node_memory_SwapTotal_bytes'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: eq
                    params: [0]

      - uid: memory_exhaustion_predicted_warning
        title: Memory Exhaustion Predicted
        condition: B
        for: 30m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "Available memory on vps_oracle projected to hit zero within 6 hours based on the last 6 hours' trend"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'predict_linear(node_memory_MemAvailable_bytes[6h], 6*3600)'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0]
