apiVersion: 1

groups:
  - orgId: 1
    name: service_probes
    folder: Monitoring
    interval: 60s
    rules:
      - uid: probe_npm_admin
        title: NPM Admin Panel Down
        condition: B
        for: 2m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "NPM Admin Panel (npm.jerome.cloudns.asia) is unreachable"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'probe_success{instance="https://npm.jerome.cloudns.asia"}'
          - refId: B
            datasourceUid: '__expr__'
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: probe_3xui_panel
        title: 3x-ui Panel Down
        condition: B
        for: 2m
