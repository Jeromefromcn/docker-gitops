services:
  prometheus:
    image: prom/prometheus@sha256:2d61f37ba9f2185195dfad94ee500d7ac1986560bac79a77d0a6de182a5bf814  # v3.13.1
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/monitoring/prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      default: {}
      proxy:
        ipv4_address: 172.19.0.4
    # Not exposed externally, no login auth, no host port published (README "minimal port
    # exposure"). Being on the proxy network serves two purposes: it claims a fixed IP as
    # registered in the README "network isolation" section, and it acts as this container's
    # only egress (default route, see the networks.default note at the end of this file).
    # No NPM and no proxy host record: other containers on the proxy network can reach it
    # directly but the public internet cannot. headlamp inside k3s reaches this IP through
    # the k3s apiserver's built-in service proxy (the apiserver is a host process, so it
    # can already reach the docker bridge directly, see
    # vps_oracle/k3s/apps/headlamp/k8s/external-prometheus.yaml) — over there a hostNetwork
    # socat relay pod forwards 9090 to this IP, and the IP is hardcoded into the socat
    # args, so it must be pinned here; if the container rebuilds and the IP drifts, that
    # k3s manifest has to be updated to match

  node-exporter:
    image: prom/node-exporter@sha256:c9ef89f9464f09e7234decaae68a80ab856ff0014435677a99fd48b03dd410ea  # v1.12.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - /:/host:ro,rslave
      # textfile collector: read-only mount of the check-sync metrics (.prom) written by host cron
      - /etc/monitoring/node-exporter-textfile:/var/lib/node_exporter/textfile_collector:ro
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
    # Deliberately no network_mode: host — trading network throughput metric accuracy for
    # simpler deployment; network alerts were out of scope here anyway

  blackbox-exporter:
    image: prom/blackbox-exporter@sha256:2d27bd2523936a9f28d1073ee12fbae1497f7d45c1b08710a271cb6c48f06550  # v0.28.0
    container_name: blackbox-exporter
    hostname: blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - default
      - egress
    # The only container in this project that needs to reach the public internet (probing
    # the https://*.jerome.cloudns.asia batch in prometheus.yml). The default network is
    # internal, so it has no default route; it gets its own egress bridge as an exit —
    # not the shared proxy network: that's the outward-facing reverse-proxy plane, and
    # putting an exporter that prometheus can order to hit any URL on it would be handing
    # out a free SSRF hop

  grafana:
    image: grafana/grafana@sha256:96b9eabbe113fffa7ce6efc6267ebe7e6e33bdc65a94d85d73b2b46cbd14e43d  # 13.1.1
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://grafana.jerome.cloudns.asia"
      TZ: "Asia/Hong_Kong"
    volumes:
      - /etc/monitoring/grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - default
      - proxy
    # NPM reverse proxy: Forward Hostname/IP = grafana, Forward Port = 3000

networks:
  default:
    internal: true
    # Why internal: prometheus/grafana are attached to both default and proxy, and both
    # have the default GwPriority of 0, so docker picks default as their actual default
    # route. Their outbound connections then source from this subnet instead of
    # 172.19.0.0/16 — which sidesteps the host-firewall.sh rule
    # `-s 172.19.0.0/16 --dport 30000:32767 ACCEPT`, so every connection to a k3s NodePort
    # hits the REJECT at the end of the INPUT chain and surfaces as "No route to host".
    # Full diagnosis in
    # docs/incidents/2026-08-24-compose-prometheus-grafana-k3s-nodeport-gateway.md
    #
    # The Compose Spec's networks.<name>.priority is the proper fix for this, but it's
    # been proven ineffective on this machine: upgrading docker-compose-plugin from 5.1.1
    # up through 5.5.0 still parses the field correctly in `docker compose config` but
    # never forwards it to the engine's NetworkConnect — containers still come up with
    # GwPriority 0 (the engine-side `docker network connect --gw-priority` works; compose
    # just doesn't forward it). Don't add this field back — it does nothing.
    #
    # So it's solved from the default side instead: an internal network has no gateway and
    # doesn't take part in default-route election, so proxy automatically becomes the only
    # egress for prometheus/grafana, the source IP falls back to 172.19.0.0/16, and the
    # existing firewall rule takes effect. The side effect is that containers on this
    # network lose public-internet access — prometheus/grafana have proxy as their exit and
    # are unaffected, node-exporter doesn't need egress anyway (also narrows its attack
    # surface), and only blackbox-exporter genuinely needs it, so it got its own egress
  egress:
    # egress bridge used only by blackbox-exporter; see that service's comment above
  proxy:
    external: true   # create once manually: docker network create proxy
