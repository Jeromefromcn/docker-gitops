services:
  prometheus:
    image: prom/prometheus@sha256:2d61f37ba9f2185195dfad94ee500d7ac1986560bac79a77d0a6de182a5bf814  # v3.13.1
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/monitoring/prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      default: {}
      proxy:
        ipv4_address: 172.19.0.4
    # 不对外暴露、没有登录认证、不发布宿主机端口 (README「端口最少暴露」)。挂 proxy
    # 网络只是为了拿一个按 README「网络隔离」章节登记的固定 IP，不接 NPM、没有
    # proxy host 记录，proxy 网络里其他容器能直连但公网连不到。k3s 里的 headlamp
    # 通过 k3s apiserver 自带的 service proxy 访问这个 IP (apiserver 是宿主机进程，
    # 本来就能直连 docker 网桥，见 vps_oracle/k3s/apps/headlamp/k8s/
    # external-prometheus.yaml) —— 固定 IP 是因为那个 EndpointSlice 是手写的，
    # 容器重建后 IP 漂移的话需要跟着改

  node-exporter:
    image: prom/node-exporter@sha256:c9ef89f9464f09e7234decaae68a80ab856ff0014435677a99fd48b03dd410ea  # v1.12.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - /:/host:ro,rslave
      # textfile collector：宿主 cron 写的 check-sync 指标（.prom）只读挂进来
      - /etc/monitoring/node-exporter-textfile:/var/lib/node_exporter/textfile_collector:ro
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
    # 不用 network_mode: host: 牺牲网络吞吐指标精度换取部署简单,网络告警本来就不在这次范围内

  blackbox-exporter:
    image: prom/blackbox-exporter@sha256:2d27bd2523936a9f28d1073ee12fbae1497f7d45c1b08710a271cb6c48f06550  # v0.28.0
    container_name: blackbox-exporter
    hostname: blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Asia/Hong_Kong"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  grafana:
    image: grafana/grafana@sha256:96b9eabbe113fffa7ce6efc6267ebe7e6e33bdc65a94d85d73b2b46cbd14e43d  # 13.1.1
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://grafana.jerome.cloudns.asia"
      TZ: "Asia/Hong_Kong"
    volumes:
      - /etc/monitoring/grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - default
      - proxy
    # NPM 反代配置: Forward Hostname/IP = grafana, Forward Port = 3000

networks:
  proxy:
    external: true   # 手动创建一次：docker network create proxy
