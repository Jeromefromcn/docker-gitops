services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui@sha256:344f7a68a91e59d592fc355d67e32d8c2041b1c2082a7eaa3c413dc3a5cab7db
    container_name: 3x-ui
    hostname: 3x-ui
    restart: unless-stopped          # 重启/崩溃自动拉起
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 && nc -z 127.0.0.1 2053 && nc -z 127.0.0.1 2096 && pgrep -f xray-linux-arm64 > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    tty: true
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      TZ: "Asia/Hong_Kong"           # 容器时区:香港 (UTC+8)
    volumes:
      - /etc/x-ui/db:/etc/x-ui/       # 面板数据库持久化
      - /etc/x-ui/cert:/root/cert/    # 证书持久化
      - /etc/x-ui/xray/xray-linux-arm64:/app/bin/xray-linux-arm64:ro  # 固定 Xray 26.6.27
    ports:
      - "14985:2053"                  # 面板:宿主机 14985 -> 容器内默认 2053
      - "443:443"                     # 节点端口(VLESS + Reality)
      - "2096:2096"                   # 订阅服务
