name: repo-conventions

on:
  push:
    branches: [main]
    paths:
      - '*/compose/**/docker-compose.yml'
      - 'vps_oracle/host-native/inspector/**'
      - '*/inspector-checks/**'
      - '*/tofu/**'
      - 'k3s/apps/lab-environment/**'
      - 'k3s/argocd/apps/lab-lanes-appset.yaml'
      - '.github/scripts/**'
      - '.github/workflows/repo-conventions.yml'
  pull_request:
    paths:
      - '*/compose/**/docker-compose.yml'
      - 'vps_oracle/host-native/inspector/**'
      - '*/inspector-checks/**'
      - '*/tofu/**'
      - 'k3s/apps/lab-environment/**'
      - 'k3s/argocd/apps/lab-lanes-appset.yaml'
      - '.github/scripts/**'
      - '.github/workflows/repo-conventions.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Turns the conventions in .claude/rules/compose-conventions.md into a check
# that fails a merge, rather than guidance that only applies when someone (or
# Claude) remembers to read it. The compose check runs at the YAML level on
# purpose — `docker compose config` would need each stack's gitignored .env.
jobs:
  compose-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check compose conventions
        run: python3 .github/scripts/check-compose-conventions.py

  inspector-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

      # Every checks/<name>.sh must have a tests/test-<name>.sh. The pairing is
      # the convention; without this, a new check can land untested (two did).
      # Covers every check tree: vps_oracle/, vps_oracle2/, vps_gcp/ and k3s/.
      # The engine under vps_oracle/host-native/inspector/ owns no checks.
      - name: Every check has a paired test
        run: |
          missing=0
          for c in */inspector-checks/checks/*.sh; do
            b="$(basename "$c" .sh)"
            t="$(dirname "$(dirname "$c")")/tests/test-$b.sh"
            if [ ! -f "$t" ]; then
              echo "::error::$c has no $t"
              missing=1
            fi
          done
          exit $missing

      - name: Run inspector test suite
        run: |
          failed=0
          # The first glob is the engine's own tests (it has no checks tree of
          # its own); the second is every check tree's.
          for t in vps_oracle/host-native/inspector/tests/test-*.sh */inspector-checks/tests/test-*.sh; do
            # test-common.sh is a helper, not a test.
            # test-inspect.sh is deliberately NOT hermetic: it runs the real
            # inspect.sh end to end and posts to the real apprise instance,
            # which lives behind NPM's self-only access list on the VPS. It
            # can only pass when run on that host:
            #   cd vps_oracle/host-native/inspector/tests && ./test-inspect.sh
            case "$(basename "$t")" in test-common.sh|test-inspect.sh) continue ;; esac
            echo "--- $t"
            ./"$t" || { echo "::error::$t failed"; failed=1; }
          done
          exit $failed

  # A scraped lab Deployment that does not load lab-metrics-defaults exposes no
  # latency histogram, and its p90/p95/p99 columns stay blank with no error.
  lab-metrics-defaults:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check scraped Deployments load lab-metrics-defaults
        run: python3 .github/scripts/check-lab-metrics-defaults.py

      - name: Test the check
        run: bash k3s/apps/lab-environment/tests/test-lab-metrics-defaults.sh

  # The lab demo helpers, against stubbed kubectl/curl/argocd - no cluster.
  # Among other things it runs `git apply --check` on every demo patch, so an
  # edit to resilience.yaml or the canary manifest that breaks a runbook page
  # (docs/demo/09-13) fails here instead of live in front of an interviewer.
  lab-demo-helpers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

      - name: Run demo helper tests
        run: bash k3s/apps/lab-environment/tests/test-demo-helpers.sh
      - name: Run lab PR lane render tests
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
          bash k3s/apps/lab-environment/tests/test-lanes.sh
          bash k3s/apps/lab-environment/tests/test-traffic-generator.sh

  # Static checks only — tofu fmt + validate never touch live cloud resources.
  # `tofu init -backend=false` only downloads provider plugins from the
  # registry; it needs no cloud credentials (OCI's InstancePrincipal /
  # GCP's key are never exercised by `validate`).
  tofu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: tofu fmt -check + init + validate
        run: |
          failed=0
          for d in $(find . -type d -name tofu -not -path './.worktrees/*'); do
            echo "--- $d"
            (cd "$d" && tofu fmt -recursive -check) || failed=1
            (cd "$d" && tofu init -backend=false -input=false >/dev/null) || failed=1
            (cd "$d" && tofu validate) || failed=1
          done
          exit $failed
