name: vikunja-notify-relay

on:
  push:
    branches: [main]
    paths:
      - 'vps_oracle/compose/vikunja/notify-relay/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/jeromefromcn/vikunja-notify-relay

jobs:
  test-build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD/vps_oracle/compose/vikunja/notify-relay:/app" -w /app python:3.12-alpine sh -c "python -m unittest test_app -v"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: vps_oracle/compose/vikunja/notify-relay
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Same referrers fallback-tag artifactType fix as placeholder-hello.
          cosign-release: v3.1.3

      - name: Sign image (keyless)
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
