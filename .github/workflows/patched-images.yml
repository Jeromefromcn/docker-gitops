name: patched-images

on:
  push:
    branches: [main]
    paths:
      - 'vps_oracle/k3s/images/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/jeromefromcn

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: homepage
            context: vps_oracle/k3s/images/homepage
          - name: trilium
            context: vps_oracle/k3s/images/trilium
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # cosign <=3.0.x (go-containerregistry <0.21.7) writes the OCI
          # referrers fallback-tag index entry with artifactType taken from
          # config.mediaType (oci.empty) instead of the manifest's real
          # artifactType, which breaks Kyverno's SigstoreBundle verifyImages
          # on registries without the referrers API (GHCR).
          cosign-release: v3.1.3

      - name: Sign image (keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
