# TZ so pod-local log timestamps (where the underlying binary honors $TZ)
# match the rest of the fleet — see root README.md's TZ convention.
# global.env covers every Deployment (server/repo-server/dex/notifications/
# applicationset); the application-controller is a StatefulSet and isn't
# covered by global.env, so it needs its own controller.env.
global:
  env:
    - name: TZ
      value: "Asia/Hong_Kong"
# Sized off observed idle usage (controller ~21m/192Mi, everything else
# single-digit m / tens of Mi) with headroom for sync/reconcile bursts.
# Previously unset on every component, meaning nothing bounded them.
#
# Memory limit bumped 512Mi -> 1Gi 2026-08-15 (phase E): the controller
# OOMKilled repeatedly once the Kyverno Application was added -- Kyverno's
# ClusterPolicy/Policy CRDs carry an unusually large embedded OpenAPI
# schema, and diffing/comparing that manifest set pushed steady-state
# memory well past the old 512Mi ceiling.
controller:
  env:
    - name: TZ
      value: "Asia/Hong_Kong"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.jerome.cloudns.asia
    accounts.jerome: apiKey,login
    admin.enabled: "false"
  rbac:
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, applicationsets, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, projects, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, certificates, *, *, allow
      p, role:admin, accounts, *, *, allow
      p, role:admin, gpgkeys, *, *, allow
      p, role:admin, logs, get, *, allow
      p, role:admin, exec, create, */*, allow
      g, jerome, role:admin
