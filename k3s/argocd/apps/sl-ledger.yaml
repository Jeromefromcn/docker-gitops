apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sl-ledger
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jeromefromcn/docker-gitops.git
    targetRevision: main
    path: k3s/apps/sl-ledger/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sl-ledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
