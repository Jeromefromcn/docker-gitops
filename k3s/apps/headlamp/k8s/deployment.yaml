apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.44.0
          args:
            - -in-cluster
            - -in-cluster-context-name=main
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          ports:
            - name: http
              containerPort: 4466
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            # subPath yields a plain file rather than the symlink farm a plain
            # ConfigMap mount creates; tzdata never changes, so subPath's lack of
            # hot-reload is irrelevant here.
            - name: tzdata
              mountPath: /usr/share/zoneinfo/Asia/Hong_Kong
              subPath: Hong_Kong
              readOnly: true
      volumes:
        - name: tzdata
          configMap:
            name: headlamp-tzdata
