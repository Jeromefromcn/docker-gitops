# The headlamp image ships no tzdata at all, so the TZ env var in deployment.yaml
# resolves to nothing and Go silently falls back to UTC. This ConfigMap carries the
# single IANA zone file (1.2 KB) that makes TZ actually take effect.
#
# A hostPath volume would be the obvious alternative, but the headlamp namespace
# enforces the `baseline` Pod Security Standard, which forbids hostPath.
#
# Regenerate (only if the Hong Kong zone definition itself ever changes upstream):
#   kubectl create configmap headlamp-tzdata -n headlamp --dry-run=client -o yaml \
#     --from-file=Hong_Kong=/usr/share/zoneinfo/Asia/Hong_Kong
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-tzdata
  namespace: headlamp
binaryData:
  Hong_Kong: 
