apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
---
# Built-in `view` deliberately excludes cluster-scoped resources (nodes, PVs,
# StorageClasses, IngressClasses, GatewayClasses, CRDs, ...), Secrets, and
# RBAC objects (Roles/RoleBindings/ClusterRoles/Bindings) — Headlamp's UI
# pages for all of these 403 without a broader grant. headlamp.jerome.cloudns.asia
# sits behind an NPM access list restricted to the operator, so a full
# cluster-wide read grant (including Secrets and RBAC) is acceptable here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-full-read
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-full-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
roleRef:
  kind: ClusterRole
  name: headlamp-full-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp
type: kubernetes.io/service-account-token
