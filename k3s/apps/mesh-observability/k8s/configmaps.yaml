apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: mesh-observability
data:
  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 24h
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    # retention_period alone does nothing in Loki 3.x TSDB — without the
    # compactor actually running, no data is ever deleted despite the 24h
    # setting (final-review finding, 2026-08-24). This is the first always-on
    # instance of this config pattern (lab-environment's copy is replicas: 0),
    # so the latent bug became operational here.
    # NOTE: `retention_enabled: true` REQUIRES `delete_request_store` in
    # Loki 3.x — omitting it makes the config fail validation and the pod
    # crash-loops (hit live 2026-08-24, see git history).
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      working_directory: /loki/compactor
      delete_request_store: filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: mesh-observability
data:
  # Same technique as lab-environment's promtail-config.yml: a
  # namespace-prefixed glob against kubelet's own per-pod log path, not
  # kubernetes_sd_configs + relabel_configs — this Promtail physically never
  # opens a log file outside pr-lanes, it doesn't just filter one out after
  # the fact. No Kubernetes API access, no RBAC/ServiceAccount needed.
  promtail-config.yml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: pr-lanes-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: pr-lanes
              namespace: pr-lanes
              __path__: /var/log/pods/pr-lanes_*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: '^/var/log/pods/pr-lanes_(?P<pod_name>[^_]+)_[0-9a-f-]+/(?P<container_name>[^/]+)/\d+\.log$'
          - labels:
              pod_name:
              service: container_name
