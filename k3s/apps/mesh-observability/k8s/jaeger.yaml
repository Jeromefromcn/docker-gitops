apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: mesh-observability
  labels:
    app: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            # Same reasoning as lab-environment's jaeger.yaml: the default
            # all-in-one in-memory store keeps every trace forever with no
            # eviction. Bound it instead of chasing the memory limit.
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            - name: MEMORY_MAX_TRACES
              value: "5000"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 9411
              name: zipkin
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
---
# Zipkin span ingest — in-cluster only, Envoy sends spans here directly.
# Never exposed via NodePort: nothing outside the cluster needs to reach it,
# and it must not cross the k3s->compose boundary this plan avoids entirely.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: mesh-observability
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - port: 9411
      targetPort: 9411
      name: zipkin
---
# Query UI/API — this is what compose's Grafana talks to, over NodePort.
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: mesh-observability
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: 30114
      name: ui
