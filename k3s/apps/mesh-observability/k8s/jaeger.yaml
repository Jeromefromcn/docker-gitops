apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: mesh-observability
  labels:
    app: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            # Same reasoning as lab-environment's jaeger.yaml: the default
            # all-in-one in-memory store keeps every trace forever with no
            # eviction. Bound it instead of chasing the memory limit.
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            - name: MEMORY_MAX_TRACES
              value: "5000"
            # OTLP ingest for compose services (via the jaeger-otlp NodePort
            # below). On by default in 1.60; set explicitly so it is visible.
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 9411
              name: zipkin
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
---
# Zipkin span ingest — in-cluster only, Envoy sends spans here directly.
# Stays ClusterIP: pods pushing out to the docker bridge is the direction that
# does not work on this host (docs/incidents/2026-08-24-k3s-pod-to-docker-bridge-blackhole.md).
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: mesh-observability
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - port: 9411
      targetPort: 9411
      name: zipkin
---
# Query UI/API — this is what compose's Grafana talks to, over NodePort.
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: mesh-observability
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: 30114
      name: ui
---
# OTLP ingest for docker compose services. Compose containers connect OUT to
# a k3s NodePort — the direction that works (same path Grafana uses to query
# jaeger-query). No auth on either port: what keeps them private is the OCI
# security list (public) and the tailscale ACL, and host-firewall.sh only lets
# the docker `proxy` network (172.19.0.0/16) reach the NodePort range.
# Each port also needs a nodeport-relay@<port> instance on vps_oracle, or
# container traffic is blackholed (vps_oracle/host-native/npm-nodeport-relay/).
# vps_oracle/inspector-checks/checks/public-nodeport-exposure.sh alerts if the
# public side ever opens. Clients: OTEL_EXPORTER_OTLP_ENDPOINT=http://10.0.0.95:30117
apiVersion: v1
kind: Service
metadata:
  name: jaeger-otlp
  namespace: mesh-observability
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - port: 4317
      targetPort: 4317
      nodePort: 30116
      name: grpc-otlp
      appProtocol: grpc
    - port: 4318
      targetPort: 4318
      nodePort: 30117
      name: http-otlp
