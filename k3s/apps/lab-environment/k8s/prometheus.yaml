apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: lab-environment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: lab-environment
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: lab-environment
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: lab-environment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lab-environment
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: prometheus
      annotations:
        # prometheus.yml is mounted via subPath, which never hot-reloads.
        # Bump this whenever prometheus-config changes.
        lab.jerome/config-rev: "2"
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 192Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lab-environment
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30093
