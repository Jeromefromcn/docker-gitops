apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: lab-environment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: lab-environment
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: lab-environment
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: lab-environment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
# Cluster-scoped because nodes are: node discovery for the cAdvisor job and
# kubelet's /metrics/cadvisor, scraped from the kubelet directly. Deliberately
# `nodes/metrics`, not `nodes/proxy`: kubelet authorizes websocket exec with
# `nodes/proxy get`, so that verb would let this ServiceAccount exec into any
# pod on any node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-prometheus-cadvisor
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-prometheus-cadvisor
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: lab-environment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-prometheus-cadvisor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lab-environment
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: prometheus
      annotations:
        # prometheus.yml is mounted via subPath, which never hot-reloads.
        # Bump this whenever prometheus-config changes.
        lab.jerome/config-rev: "5"
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            # Go's soft memory limit, deliberately below the cgroup limit.
            # Unset, the GC pacer is free to overshoot the container limit
            # before collecting — the 2026-09-27 OOMKill followed exactly
            # that shape (container-to-container anon differed by 55MiB at
            # comparable uptime, far more than the +0.02MiB/h RSS slope).
            # Sized well above the ~190MiB anon floor so it bounds the
            # spike without causing GC thrash.
            - name: GOMEMLIMIT
              value: "400MiB"
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            # No volume, so the TSDB lives on the container's writable
            # layer and its page cache is charged to the same cgroup. This
            # caps that growth direction; it does not bound anon, which is
            # what the memory limit above has to cover.
            - --storage.tsdb.retention.size=128MB
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            # Raised 2026-09-27, from 128Mi/192Mi. The old limit was below
            # this container's actual need, not merely tight: anon alone
            # (not reclaimable) reached 188MiB before a kill, and the TSDB's
            # page cache is charged to the same cgroup, so only ~120MiB of
            # the budget was ever available to the Go heap.
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lab-environment
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30093
