# Its own identity even at rest, although nothing admits it then: postgres
# and redis grant it only while docs/demo/17 runs. Resident on purpose - a
# demo patch that adds and later reverts serviceAccountName leaves the
# API-server-defaulted serviceAccount field behind, which re-defaults the
# name and blocks new pods once the ServiceAccount is gone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toxiproxy
  namespace: lab-environment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: lab-environment
  labels:
    app: toxiproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: toxiproxy
    spec:
      serviceAccountName: toxiproxy
      enableServiceLinks: false
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.9.0
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 25m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: lab-environment
spec:
  selector:
    app: toxiproxy
  ports:
    - port: 8474
      targetPort: 8474
      name: api
