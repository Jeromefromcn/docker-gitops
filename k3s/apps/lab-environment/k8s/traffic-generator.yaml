apiVersion: v1
kind: ServiceAccount
metadata:
  name: traffic-generator
  namespace: lab-environment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-generator
  namespace: lab-environment
data:
  run.sh: |
    #!/bin/sh
    # ~2 rps of browsing traffic: owner list, owner detail (gateway
    # aggregation -> customers -> visits), single owner, vet list. One log
    # line per request so error counts are provable from Loki.
    #
    # A demo that counts its own requests pauses this loop: demo-window writes a
    # unix deadline to Consul KV and the loop idles until it passes. It fails
    # open - a missing key, a past deadline, garbage or an unreachable Consul all
    # keep the traffic running - and the deadline expires by itself, so a crashed
    # demo cannot leave the generator silent. Consul KV, not git or kubectl: any
    # edit to a managed resource is reverted by selfHeal within seconds.
    CONSUL_URL=${CONSUL_URL:-http://consul:8500}
    PAUSE_KEY=lab/traffic-generator/pause-until
    i=0
    while true; do
      pause_until=$(curl -s -m 2 "$CONSUL_URL/v1/kv/$PAUSE_KEY?raw")
      if [ "$pause_until" -gt "$(date +%s)" ] 2>/dev/null; then sleep 1; continue; fi
      i=$((i + 1))
      id=$(( (i % 10) + 1 ))
      case $((i % 4)) in
        0) path="/api/customer/owners" ;;
        1) path="/api/gateway/owners/$id" ;;
        2) path="/api/vet/vets" ;;
        *) path="/api/customer/owners/$id" ;;
      esac
      code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$TARGET_URL$path")
      echo "$(date -Iseconds) $code $path"
      sleep 0.5
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: lab-environment
  labels:
    app: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
        trivy-operator.skip: "true"
      annotations:
        # run.sh is read once at start; bump this to roll the pod after editing it.
        lab.jerome/config-rev: "2"
    spec:
      serviceAccountName: traffic-generator
      enableServiceLinks: false
      containers:
        - name: traffic-generator
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/opt/run.sh"]
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: TARGET_URL
              # Through the ingress gateway, so every generated request
              # exercises the same edge the demo's external calls do.
              value: "http://lab-ingress-istio:80"
          volumeMounts:
            - name: script
              mountPath: /opt
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: script
          configMap:
            name: traffic-generator
