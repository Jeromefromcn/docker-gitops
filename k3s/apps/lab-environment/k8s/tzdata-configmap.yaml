# A zone file for images that ship no tzdata. Without /usr/share/zoneinfo/Asia/Hong_Kong the
# TZ env var silently falls back to UTC (the traffic generator's curl image is one: its log
# lines printed +00:00). Mount it with subPath so a plain file lands at that path.
#
# It only helps programs that format their timestamps in local time. Measured on the same
# arm64 images (2026-10-01): Loki, promtail and toxiproxy log in UTC whatever TZ says,
# Envoy and Prometheus likewise, and Jaeger logs epoch seconds, so none of those get it.
# A hostPath volume would also work in this namespace (no Pod Security enforcement), but this
# does not depend on what the node ships.
#
# Regenerate (only if the Hong Kong zone definition itself ever changes upstream):
#   kubectl create configmap lab-tzdata -n lab-environment --dry-run=client -o yaml \
#     --from-file=Hong_Kong=/usr/share/zoneinfo/Asia/Hong_Kong
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-tzdata
  namespace: lab-environment
