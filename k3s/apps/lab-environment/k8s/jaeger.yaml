apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: lab-environment
  labels:
    app: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: jaeger
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            # OTLP ingest for Istio's otel-lab provider (Envoy spans).
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # Default all-in-one memory storage keeps every trace forever with
            # no eviction, so RSS grows until it hits the memory limit no
            # matter how high that limit is set (already bumped 128Mi->256Mi
            # once and it's OOM-killing again days later). Bound the store
            # instead of chasing the limit.
            #
            # The bound was the right instinct but the number was wrong:
            # measured 2026-09-27 at ~41KiB of heap per retained trace, so
            # 5000 traces needs ~202MiB of heap — most of the old 256Mi
            # limit — while the GC pacer was allowed to reach next_gc at
            # 324MiB, 26% over the cap. The first container died at 254.7MiB
            # after 2h43m; the next survived 33h at 243.6MiB only because it
            # happened not to tip over. Both halves are fixed as of
            # 2026-09-27: 2000 traces is ~83MiB of heap, comfortably inside
            # the 384Mi limit below. Cutting the bound alone would have made
            # the old limit work; the raise is what leaves room to raise the
            # bound again later without another kill.
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            - name: MEMORY_MAX_TRACES
              value: "2000"
            # Go soft memory limit, below the cgroup limit — see the same
            # note in prometheus.yaml.
            - name: GOMEMLIMIT
              value: "300MiB"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 9411
              name: zipkin
            - containerPort: 4317
              name: otlp-grpc
          resources:
            # Raised 2026-09-27, from 64Mi/256Mi — a second raise of this
            # container's limit, which is why the env comment above argues
            # against exactly this. It is justified here only because the
            # plateau is now measured (243.6-254.7MiB, i.e. ~97% of the old
            # limit) rather than assumed, so 384Mi is a ceiling with real
            # headroom rather than another guess.
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: lab-environment
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: 30095
      name: ui
    - port: 9411
      targetPort: 9411
      name: zipkin
    - port: 4317
      targetPort: 4317
      name: grpc-otlp
      appProtocol: grpc
