apiVersion: v1
kind: Namespace
metadata:
  name: lab-environment
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-environment-quota
  namespace: lab-environment
spec:
  hard:
    # Requests only. This is a blast-radius ceiling for the node, not a memory
    # budget for the lab: nothing here caps a container's run-time usage (its
    # own limit does), it only bounds what the scheduler reserves so the other
    # namespaces on vps-oracle2 can still place pods. Limits are deliberately
    # not capped: CPU limits are overcommitted on purpose (JVM startup bursts).
    #
    # Sized as ~70% of the node's 11927Mi allocatable, and derived from what a
    # release actually needs:
    #   steady state (5x customers + 3x api-gateway + 2x waypoint + 2x ingress
    #     + the infra/observability pods, all at their JVM/Envoy requests)  5200Mi
    #   + one rolling-update surge pod for each Deployment a release touches
    #     (business x4 + postgres + waypoint + generator)                   1824Mi
    #   + the 64Mi db-init PreSync hook (small, but a sync cannot start
    #     without it, so it must always fit)                                  64Mi
    #                                       worst-case peak = 7088Mi -> 8Gi cap
    # 6Gi was the old limits.memory value carried over, not a derived number,
    # and it deadlocked a release of 3+ workloads on 2026-09-25: the surge pods
    # filled the quota, the hook was rejected with FailedCreate, and the sync
    # stalled on "waiting for completion of hook" for 10 minutes.
    #
    # CPU, derived the same way (2026-09-28). Requests sit at measured
    # steady-state usage (JVMs 20m, Envoys 50m, infra 10-20m), so:
    #   steady state                                                   550m
    #   + surge: business x4 (20m) + ingress + waypoint (50m) + generator 200m
    #   + db-init PreSync hook                                          20m
    #                                        worst-case peak = 770m
    # Upper bound: vps-oracle2's allocatable 1700m (2000m minus the kubelet
    # reservations in k3s/install/agent-vps-oracle2/config.yaml) minus the
    # node DaemonSets (250m) and a ztunnel surge pod (50m) = 1400m. Memory
    # holds the same way: the full 8Gi quota + DaemonSets ~640Mi fits the
    # ~9.4Gi allocatable. Staying under the bound means whatever the quota
    # admits can also be scheduled — the quota rejects a pod (FailedCreate)
    # before the node would leave it Pending. 1200m keeps
    # ~430m above the peak for sub-project 2b's extra Deployments.
    # The old value, 2, was the whole node, so the quota never bound on CPU
    # and the node's cores did: a release peaked at ~1825m/2000m.
    requests.cpu: 1200m
    requests.memory: 8Gi
