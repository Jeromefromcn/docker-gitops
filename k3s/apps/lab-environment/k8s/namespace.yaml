apiVersion: v1
kind: Namespace
metadata:
  name: lab-environment
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-environment-quota
  namespace: lab-environment
spec:
  hard:
    requests.cpu: "1.5"
    requests.memory: 3.5Gi
    # 5: the four JVM services got 1000m limits (was 250m) for startup —
    # sum of all limits is 4.93. Overcommits vps-oracle2's 2 cores on paper;
    # limits only matter when several JVMs start at once.
    limits.cpu: "5"
    limits.memory: 4.25Gi
