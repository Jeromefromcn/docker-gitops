apiVersion: v1
kind: Namespace
metadata:
  name: lab-environment
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-environment-quota
  namespace: lab-environment
spec:
  hard:
    # Requests only, sized just to let the lab schedule (2026-09-25 baseline:
    # customers x5 + api-gateway x3 at 384Mi JVM requests, 4 Envoys, traffic
    # generator, db-init Job, one rolling-update surge pod). Limits are
    # deliberately not capped here: CPU limits are overcommitted on purpose
    # (JVM startup bursts), and each container's own memory limit is its OOM
    # ceiling. Raise when something genuinely stops scheduling.
    requests.cpu: "2"
    requests.memory: 6Gi
