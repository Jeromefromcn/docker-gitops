apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: lab-environment
  labels:
    app: promtail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: promtail
      annotations:
        # promtail-config.yml is mounted via subPath, which never hot-reloads
        # and does not even pick up a ConfigMap update on a running pod.
        # Bump this whenever promtail-config changes. (Found the hard way:
        # the Task 13 JSON pipeline stage was a no-op on a 26h-old pod.)
        lab.jerome/config-rev: "1"
    spec:
      enableServiceLinks: false
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          args:
            - -config.file=/etc/promtail/promtail-config.yml
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            # Same reasoning as prometheus: with the soft limit unset the
            # GC pacer may overshoot the cgroup limit before collecting.
            # This container sat exactly at its cap (memory.peak == limit,
            # 99.2% of it in use) surviving only because ~26MiB of that
            # was reclaimable page cache and slab.
            - name: GOMEMLIMIT
              value: "100MiB"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/promtail-config.yml
              subPath: promtail-config.yml
            # Read-only, node-local kubelet log path. The scrape glob in
            # promtail-config.yml is prefixed /var/log/pods/lab-environment_*
            # so this pod only ever reads its own namespace's log files even
            # though the mount itself isn't namespace-scoped — see the note
            # in configmaps.yaml.
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            # Raised 2026-09-27, from 32Mi/64Mi. The 64Mi limit was being
            # reached exactly (memory.peak == the cap) against a file set
            # that grows with pod churn, so this was the same failure
            # waiting to happen as prometheus's.
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
