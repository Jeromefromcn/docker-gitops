apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lab-environment
  labels:
    app: api-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One extra pod at a time: zero downtime, and never more than one JVM
      # booting at once on the 2-core node.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: api-gateway
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: ops-lab/api-gateway:8839b4c7fa57
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: SPRING_CLOUD_CONSUL_HOST
              value: "consul"
            - name: SPRING_CLOUD_CONSUL_PORT
              value: "8500"
            # JVM container-detection is broken under this containerd/cgroup v2
            # (MaxHeap defaults to ~6Gi = 25% of host RAM), so the heap grows
            # past the 512Mi limit and gets OOM-killed. The apps only use
            # ~100Mi heap — pin it explicitly.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -Xms64m -XX:MaxDirectMemorySize=64m -XX:MaxRAM=512m"
          ports:
            - containerPort: 8080
          resources:
            # Request ~ observed RSS (270-340Mi) plus headroom, so the
            # scheduler doesn't reserve the full limit; the limit stays the
            # OOM ceiling. Heap is -Xms64m/-Xmx192m — non-heap drives RSS.
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # Spring Boot startup is CPU-bound: at the old 250m limit it took
          # 61-98 s with ~half of all CFS periods throttled. The limit only
          # bites during startup; steady state sits far below it.
          # startupProbe holds readiness off until the app is actually up
          # (up to 180 s); readinessProbe then uses Spring's own readiness
          # group, so "Ready" means "serving", not "container started".
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lab-environment
  labels:
    istio.io/use-waypoint: waypoint
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30097
