# L7 authorization, enforced at the waypoint (the Services carry
# istio.io/use-waypoint). Who may call which Service.
#
# The four caller policies were dry-run first: with istio.io/dry-run set, a
# would-be-denied request still succeeded and incremented the waypoint's
# rbac.*shadow_denied counter instead. Baseline over real traffic was 0, and
# an illegal call (traffic-generator -> customers-service, a principal not in
# customers-service-callers) raised it by exactly 1, so the policies match
# what they intend to. Now enforced.
#
# Client audit (from live Consul KV and pod env, 2026-09-26):
#   api-gateway        <- lab-ingress-istio (the only external entry)
#   customers-service  <- api-gateway
#   visits-service     <- api-gateway, customers-service
#   vets-service       <- api-gateway
# Prometheus scrapes pod IPs directly rather than through the waypoint, and
# kubelet probes originate from the node, so neither appears here.
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-gateway-callers
  namespace: lab-environment
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: api-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/lab-environment/sa/lab-ingress-istio
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: customers-service-callers
  namespace: lab-environment
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: customers-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/lab-environment/sa/api-gateway
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: visits-service-callers
  namespace: lab-environment
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: visits-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/lab-environment/sa/api-gateway
              - cluster.local/ns/lab-environment/sa/customers-service
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: vets-service-callers
  namespace: lab-environment
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: vets-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/lab-environment/sa/api-gateway
---
# actuator exposes env/heapdump, so it is never reachable through Service
# traffic. Enforced from the start, not dry-run: it targets the waypoint only,
# and both kubelet probes and Prometheus reach pods by IP, never through it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-actuator
  namespace: lab-environment
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - /actuator
              - /actuator/*
