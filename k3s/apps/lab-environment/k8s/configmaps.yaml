apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab-environment
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: consul
        metrics_path: /v1/agent/metrics
        params:
          format: ["prometheus"]
        static_configs:
          - targets: ["consul:8500"]

      # Business services expose Spring Boot Actuator's Prometheus endpoint.
      # Discovered per pod (a Service-name target would hit one random
      # replica per scrape). Opt-in via prometheus.io/* pod annotations.
      - job_name: spring-boot-services
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [lab-environment]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # The ingress/waypoint Envoys carry Istio's prometheus.io annotations
          # too; envoy-stats scrapes them, so skip them here or every istio_*
          # series is counted twice.
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            action: drop
            regex: .+
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name, __meta_kubernetes_pod_annotation_prometheus_io_port]
            separator: ":"
            target_label: instance
          - target_label: env
            replacement: lab

      # Waypoint + ingress Envoy stats (istio_requests_total etc.). Envoy
      # exposes them on the sidecar's own admin port 15020, not the gateway's
      # service port, and the pods are found by the Gateway API's own label so
      # neither gateway has to be named twice.
      - job_name: envoy-stats
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [lab-environment]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            action: keep
            regex: waypoint|lab-ingress
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:15020'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            target_label: gateway
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Kubernetes object state from the shared cluster-wide KSM
      # (k3s/kube-state-metrics/). Only this namespace's series are kept:
      # the isolation that matters is the alert pipeline, not the source.
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc:8080"]
        metric_relabel_configs:
          - source_labels: [namespace]
            action: keep
            regex: lab-environment

      # cAdvisor straight from the lab node's kubelet, so the ClusterRole
      # needs only `nodes/metrics` — the API server's node proxy would need
      # `nodes/proxy`, which kubelet also accepts for websocket exec. Only
      # the lab node (label dedicated=lab): it is the only one the lab reads,
      # and oracle2's host firewall admits pods to its own :10250 only
      # (vps_oracle2/host-native/host-firewall/). Keeps lab containers plus
      # the node's root cgroup (id="/"), where node-level CPU saturation is
      # read from.
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_dedicated]
            action: keep
            regex: lab
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:10250
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total|container_cpu_usage_seconds_total|container_memory_working_set_bytes
          - source_labels: [namespace, id]
            separator: ";"
            action: keep
            regex: "lab-environment;.*|;/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: lab-environment
data:
  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 24h
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    # retention_period alone does nothing in Loki 3.x TSDB — the compactor
    # must be enabled or no data is ever deleted. Same fix applied to
    # mesh-observability's copy (2026-08-24 final-review finding); kept here
    # so this config is correct the day lab-environment is ever scaled up.
    # NOTE: `retention_enabled: true` REQUIRES `delete_request_store` in
    # Loki 3.x — omitting it makes the config fail validation and crash-loop.
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      working_directory: /loki/compactor
      delete_request_store: filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: lab-environment
data:
  # Rewritten from the compose version: that one used docker_sd_configs +
  # /var/run/docker.sock to discover containers, which doesn't exist under
  # containerd. This version reads kubelet's standard per-pod log path
  # directly via a namespace-prefixed glob (/var/log/pods/lab-environment_*/…)
  # — no Kubernetes API access, no RBAC/ServiceAccount needed, and it
  # physically never opens another namespace's log files, which is a
  # stronger isolation guarantee than filtering after the fact with
  # kubernetes_sd_configs + relabel_configs would give.
  promtail-config.yml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: lab-environment-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: lab-environment
              namespace: lab-environment
              __path__: /var/log/pods/lab-environment_*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: '^/var/log/pods/lab-environment_(?P<pod_name>[^_]+)_[0-9a-f-]+/(?P<container_name>[^/]+)/\d+\.log$'
          - labels:
              pod_name:
              service: container_name
          # Envoy (waypoint/ingress) JSON access logs: promote only
          # low-cardinality fields; trace_id stays in the line (Grafana's
          # derived field links it to Jaeger).
          - match:
              selector: '{service="istio-proxy"}'
              stages:
                - json:
                    expressions:
                      response_code: response_code
                      response_flags: response_flags
                - labels:
                    response_code:
                    response_flags:
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: lab-environment
data:
  # Fixed UIDs: the dashboard and the cross-datasource links below refer to
  # datasources by uid, so a re-provisioned Grafana keeps them resolvable.
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          # Envoy JSON logs carry "trace_id"; Spring app logs carry the same
          # 32-hex trace id in their correlation prefix. Either way the id is
          # the only 32-hex run in the line, so one regex covers both.
          derivedFields:
            - name: TraceID
              matcherRegex: '([0-9a-f]{32})'
              datasourceUid: jaeger
              url: '$${__value.raw}'

      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        jsonData:
          # The reverse direction: from a span, show the log lines that carry
          # its trace id. Widened by 5 min either side for clock skew.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            customQuery: true
            query: '{namespace="lab-environment"} |= "$${__trace.traceId}"'
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: lab-environment
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/json
          foldersFromFilesStructure: true
  # Lab capacity alerts. No contact point on purpose: they show in this
  # Grafana only — the inspector already pages for Pending/FailedCreate/quota,
  # and chaos drills must stay out of the real alert pipeline. To page later,
  # add a contact point + notification policy; these rules do not change.
  alerting.yml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: lab_capacity
        folder: Lab Capacity
        interval: 30s
        rules:
          - uid: lab_pod_pending
            title: Lab Pod Pending
            condition: B
            for: 3m
            noDataState: OK
            annotations:
              summary: "A lab-environment pod has been Pending for 3 minutes (quota or node requests exhausted?)"
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: {from: 300, to: 0}
                model: {refId: A, instant: true, expr: 'sum(kube_pod_status_phase{namespace="lab-environment", phase="Pending"})'}
              - refId: B
                datasourceUid: '__expr__'
                model: {refId: B, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}
          - uid: lab_quota_near_limit
            title: Lab Quota Near Limit
            condition: B
            for: 2m
            noDataState: OK
            annotations:
              summary: "A lab-environment-quota resource (CPU or memory requests, or any other quota item) above 90% of hard"
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: {from: 300, to: 0}
                model: {refId: A, instant: true, expr: 'max(max by (resource) (kube_resourcequota{namespace="lab-environment", type="used"}) / max by (resource) (kube_resourcequota{namespace="lab-environment", type="hard"}))'}
              - refId: B
                datasourceUid: '__expr__'
                model: {refId: B, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0.9]}}]}
          - uid: lab_cpu_throttling
            title: Lab CPU Throttling
            condition: B
            for: 10m
            noDataState: OK
            annotations:
              summary: "A lab container spent over 50% of its CFS periods throttled for 10 minutes"
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: {from: 600, to: 0}
                model: {refId: A, instant: true, expr: 'max(rate(container_cpu_cfs_throttled_periods_total{namespace="lab-environment", container!=""}[5m]) / rate(container_cpu_cfs_periods_total{namespace="lab-environment", container!=""}[5m]))'}
              - refId: B
                datasourceUid: '__expr__'
                model: {refId: B, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0.5]}}]}
          - uid: lab_container_restarts
            title: Lab Container Restarts
            condition: B
            for: 0s
            noDataState: OK
            annotations:
              summary: "A lab container restarted in the last 10 minutes"
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: {from: 600, to: 0}
                model: {refId: A, instant: true, expr: 'sum(increase(kube_pod_container_status_restarts_total{namespace="lab-environment"}[10m]))'}
              - refId: B
                datasourceUid: '__expr__'
                model: {refId: B, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}
          - uid: lab_oomkilled
            title: Lab OOMKilled
            condition: B
            for: 0s
            noDataState: OK
            annotations:
              summary: "A lab container was OOMKilled and restarted in the last 10 minutes"
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: {from: 600, to: 0}
                model: {refId: A, instant: true, expr: 'count(max by (pod, container) (kube_pod_container_status_last_terminated_reason{namespace="lab-environment", reason="OOMKilled"}) and on (pod, container) (increase(kube_pod_container_status_restarts_total{namespace="lab-environment"}[10m]) > 0))'}
              - refId: B
                datasourceUid: '__expr__'
                model: {refId: B, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}
          # Every rule above reads kube-state-metrics and has noDataState OK,
          # so a KSM outage would silence all of them at once. This one is
          # the opposite: no data is itself the alert.
          - uid: lab_ksm_down
            title: Lab KSM Down
            condition: B
            for: 3m
            noDataState: Alerting
            annotations:
              summary: "kube-state-metrics is not being scraped - the other Lab Capacity rules cannot fire while it is down"
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: {from: 300, to: 0}
                model: {refId: A, instant: true, expr: 'max(up{job="kube-state-metrics"})'}
              - refId: B
                datasourceUid: '__expr__'
                model: {refId: B, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: lab-environment
data:
  init-multiple-databases.sh: |
    #!/bin/bash
    # Creates one database per name in $POSTGRES_MULTIPLE_DATABASES (comma-separated),
    # owned by $POSTGRES_USER. Runs once, on first container init, via
    # docker-entrypoint-initdb.d.
    set -euo pipefail

    if [ -z "${POSTGRES_MULTIPLE_DATABASES:-}" ]; then
      exit 0
    fi

    IFS=',' read -ra DBS <<< "$POSTGRES_MULTIPLE_DATABASES"
    for db in "${DBS[@]}"; do
      echo "Creating database '$db'"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE "$db" OWNER "$POSTGRES_USER";
    EOSQL
    done
