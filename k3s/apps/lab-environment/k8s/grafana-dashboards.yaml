apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: lab-environment
data:
  lab-mesh-overview.json: |
    {
      "uid": "lab-mesh-overview",
      "title": "Lab Mesh Overview",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "customers-service RPS per pod (load balancing)",
         "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by (pod) (rate(http_server_requests_seconds_count{service=\"customers-service\", uri!~\"/actuator.*\"}[1m]))", "legendFormat": "{{pod}}"}]},
        {"type": "timeseries", "title": "Mesh requests by service and code (waypoint)",
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by (destination_canonical_service, response_code) (rate(istio_requests_total{reporter=\"waypoint\"}[1m]))", "legendFormat": "{{destination_canonical_service}} {{response_code}}"}]},
        {"type": "timeseries", "title": "Envoy response flags (UT=timeout, UH=no healthy upstream, URX=retry limit, UO=overflow)",
         "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by (destination_canonical_service, response_flags) (rate(istio_requests_total{response_flags!=\"-\"}[5m]))", "legendFormat": "{{destination_canonical_service}} {{response_flags}}"}]},
        {"type": "timeseries", "title": "P99 latency (ms) by service",
         "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "histogram_quantile(0.99, sum by (le, destination_canonical_service) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\"}[5m])))", "legendFormat": "{{destination_canonical_service}}"}]},
        {"type": "timeseries", "title": "Outlier ejections active",
         "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by (cluster_name) (envoy_cluster_outlier_detection_ejections_active{gateway=\"waypoint\"})", "legendFormat": "{{cluster_name}}"}]},
        {"type": "timeseries", "title": "Upstream retries",
         "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by (cluster_name) (rate(envoy_cluster_upstream_rq_retry{gateway=\"waypoint\"}[5m]))", "legendFormat": "{{cluster_name}}"}]},
        {"type": "timeseries", "title": "Quota: requests used / hard",
         "gridPos": {"x": 0, "y": 24, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1}},
         "targets": [{"expr": "max by (resource) (kube_resourcequota{namespace=\"lab-environment\", type=\"used\"}) / max by (resource) (kube_resourcequota{namespace=\"lab-environment\", type=\"hard\"})", "legendFormat": "{{resource}}"}]},
        {"type": "timeseries", "title": "CPU throttling ratio by container",
         "gridPos": {"x": 8, "y": 24, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "percentunit"}},
         "targets": [{"expr": "max by (pod, container) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"lab-environment\", container!=\"\"}[5m]) / rate(container_cpu_cfs_periods_total{namespace=\"lab-environment\", container!=\"\"}[5m]))", "legendFormat": "{{pod}}/{{container}}"}]},
        {"type": "timeseries", "title": "Container restarts (10m)",
         "gridPos": {"x": 16, "y": 24, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\"lab-environment\"}[10m]))", "legendFormat": "{{pod}}/{{container}}"}]}
      ]
    }
  lab-business.json: |
    {
      "uid": "lab-business",
      "title": "Lab Business",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "lab",
        "business"
      ],
      "templating": {
        "list": [
          {"name": "window", "label": "Window", "type": "custom", "query": "1m,5m,10m", "current": {"text": "5m", "value": "5m"}, "options": [{"text": "1m", "value": "1m", "selected": false}, {"text": "5m", "value": "5m", "selected": true}, {"text": "10m", "value": "10m", "selected": false}]},
          {"name": "service", "label": "Service", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(http_server_requests_seconds_count, service)", "refId": "svc"}, "refresh": 2, "multi": true, "includeAll": true, "allValue": ".*", "current": {"text": "All", "value": "$__all"}, "sort": 1}
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Inbound endpoints (per service)",
          "description": "One row per endpoint, from each service's own Spring instrumentation (http_server_requests); /actuator is excluded. api-gateway's proxied traffic has no URI template, so it is shown per route as route:<routeId>. Max latency is the largest Micrometer sliding max seen in the window; trustworthy for windows of 1m or more. With few requests in the window (especially 1m) the averages are noisy, so read Calls first.",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(sum by (service, method, uri) (increase(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window]))) or (sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_count{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\")))", "instant": true, "range": false, "format": "table"}, {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(sum by (service, method, uri) (rate(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window]))) or (sum by (service, method, uri) (label_replace(label_replace(rate(spring_cloud_gateway_requests_seconds_count{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\")))", "instant": true, "range": false, "format": "table"}, {"refId": "C", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(((sum by (service, method, uri) (increase(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\", status=~\"5..\"}[$window]))) / (sum by (service, method, uri) (increase(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window])))) or ((sum by (service, method, uri) (increase(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window]))) * 0)) or (((sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_count{service=~\"$service\", httpStatusCode=~\"5..\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\"))) / (sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_count{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\")))) or ((sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_count{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\"))) * 0))", "instant": true, "range": false, "format": "table"}, {"refId": "D", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "((sum by (service, method, uri) (increase(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\", status=\"429\"}[$window]))) or ((sum by (service, method, uri) (increase(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window]))) * 0)) or ((sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_count{service=~\"$service\", httpStatusCode=\"429\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\"))) or ((sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_count{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\"))) * 0))", "instant": true, "range": false, "format": "table"}, {"refId": "E", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "((sum by (service, method, uri) (increase(http_server_requests_seconds_sum{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window]))) / ((sum by (service, method, uri) (increase(http_server_requests_seconds_count{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window]))) > 0)) or ((sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_sum{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\"))) / ((sum by (service, method, uri) (label_replace(label_replace(increase(spring_cloud_gateway_requests_seconds_count{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\"))) > 0))", "instant": true, "range": false, "format": "table"}, {"refId": "F", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(max by (service, method, uri) (max_over_time(http_server_requests_seconds_max{service=~\"$service\", uri!~\"/actuator.*|UNKNOWN\"}[$window]))) or (max by (service, method, uri) (label_replace(label_replace(max_over_time(spring_cloud_gateway_requests_seconds_max{service=~\"$service\"}[$window]), \"method\", \"$1\", \"httpMethod\", \"(.*)\"), \"uri\", \"route:$1\", \"routeId\", \"(.*)\")))", "instant": true, "range": false, "format": "table"}],
          "transformations": [{"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"service": 0, "method": 1, "uri": 2, "Value #A": 3, "Value #B": 4, "Value #C": 5, "Value #D": 6, "Value #E": 7, "Value #F": 8}, "renameByName": {"service": "Service", "method": "Method", "uri": "Endpoint", "Value #A": "Calls", "Value #B": "QPS", "Value #C": "5xx rate", "Value #D": "429 count", "Value #E": "Avg latency", "Value #F": "Max latency"}}}, {"id": "filterByValue", "options": {"type": "include", "match": "all", "filters": [{"fieldName": "Calls", "config": {"id": "greater", "options": {"value": 0}}}]}}],
          "fieldConfig": {"defaults": {"custom": {"align": "auto", "cellOptions": {"type": "auto"}}}, "overrides": [{"matcher": {"id": "byName", "options": "Calls"}, "properties": [{"id": "unit", "value": "none"}, {"id": "decimals", "value": 0}]}, {"matcher": {"id": "byName", "options": "QPS"}, "properties": [{"id": "unit", "value": "reqps"}, {"id": "decimals", "value": 2}]}, {"matcher": {"id": "byName", "options": "5xx rate"}, "properties": [{"id": "unit", "value": "percentunit"}, {"id": "decimals", "value": 1}, {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.0001}]}}, {"id": "custom.cellOptions", "value": {"type": "color-text"}}]}, {"matcher": {"id": "byName", "options": "429 count"}, "properties": [{"id": "unit", "value": "none"}, {"id": "decimals", "value": 0}, {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, {"id": "custom.cellOptions", "value": {"type": "color-text"}}]}, {"matcher": {"id": "byName", "options": "Avg latency"}, "properties": [{"id": "unit", "value": "s"}, {"id": "decimals", "value": 1}]}, {"matcher": {"id": "byName", "options": "Max latency"}, "properties": [{"id": "unit", "value": "s"}, {"id": "decimals", "value": 1}]}]},
          "options": {"showHeader": true, "cellHeight": "sm", "sortBy": [{"displayName": "Calls", "desc": true}]}
        },
        {
          "id": 2,
          "type": "table",
          "title": "Outbound calls (caller → callee)",
          "description": "One row per caller-to-callee pair, from the mesh waypoint (istio_requests_total); independent of application instrumentation. lab-ingress-istio -> api-gateway is the outermost system entry. Service level only: no endpoint path and no max. p90/p95/p99 are interpolated from histogram buckets and unreliable when the window holds few samples.",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 10},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (source_workload, destination_canonical_service) (increase(istio_requests_total{reporter=\"waypoint\", source_workload=~\"$service\"}[$window]))", "instant": true, "range": false, "format": "table"}, {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (source_workload, destination_canonical_service) (rate(istio_requests_total{reporter=\"waypoint\", source_workload=~\"$service\"}[$window]))", "instant": true, "range": false, "format": "table"}, {"refId": "C", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "((sum by (source_workload, destination_canonical_service) (increase(istio_requests_total{reporter=\"waypoint\", source_workload=~\"$service\", response_code=~\"5..\"}[$window]))) / (sum by (source_workload, destination_canonical_service) (increase(istio_requests_total{reporter=\"waypoint\", source_workload=~\"$service\"}[$window])))) or ((sum by (source_workload, destination_canonical_service) (increase(istio_requests_total{reporter=\"waypoint\", source_workload=~\"$service\"}[$window]))) * 0)", "instant": true, "range": false, "format": "table"}, {"refId": "D", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(sum by (source_workload, destination_canonical_service) (increase(istio_requests_total{reporter=\"waypoint\", source_workload=~\"$service\", response_code=\"429\"}[$window]))) or ((sum by (source_workload, destination_canonical_service) (increase(istio_requests_total{reporter=\"waypoint\", source_workload=~\"$service\"}[$window]))) * 0)", "instant": true, "range": false, "format": "table"}, {"refId": "E", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(sum by (source_workload, destination_canonical_service) (increase(istio_request_duration_milliseconds_sum{reporter=\"waypoint\", source_workload=~\"$service\"}[$window]))) / ((sum by (source_workload, destination_canonical_service) (increase(istio_request_duration_milliseconds_count{reporter=\"waypoint\", source_workload=~\"$service\"}[$window]))) > 0)", "instant": true, "range": false, "format": "table"}, {"refId": "F", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.9, sum by (le, source_workload, destination_canonical_service) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", source_workload=~\"$service\"}[$window])))", "instant": true, "range": false, "format": "table"}, {"refId": "G", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le, source_workload, destination_canonical_service) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", source_workload=~\"$service\"}[$window])))", "instant": true, "range": false, "format": "table"}, {"refId": "H", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.99, sum by (le, source_workload, destination_canonical_service) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", source_workload=~\"$service\"}[$window])))", "instant": true, "range": false, "format": "table"}],
          "transformations": [{"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"source_workload": 0, "destination_canonical_service": 1, "Value #A": 2, "Value #B": 3, "Value #C": 4, "Value #D": 5, "Value #E": 6, "Value #F": 7, "Value #G": 8, "Value #H": 9}, "renameByName": {"source_workload": "Caller", "destination_canonical_service": "Callee", "Value #A": "Calls", "Value #B": "QPS", "Value #C": "5xx rate", "Value #D": "429 count", "Value #E": "Avg latency", "Value #F": "p90", "Value #G": "p95", "Value #H": "p99"}}}, {"id": "filterByValue", "options": {"type": "include", "match": "all", "filters": [{"fieldName": "Calls", "config": {"id": "greater", "options": {"value": 0}}}]}}],
          "fieldConfig": {"defaults": {"custom": {"align": "auto", "cellOptions": {"type": "auto"}}}, "overrides": [{"matcher": {"id": "byName", "options": "Calls"}, "properties": [{"id": "unit", "value": "none"}, {"id": "decimals", "value": 0}]}, {"matcher": {"id": "byName", "options": "QPS"}, "properties": [{"id": "unit", "value": "reqps"}, {"id": "decimals", "value": 2}]}, {"matcher": {"id": "byName", "options": "5xx rate"}, "properties": [{"id": "unit", "value": "percentunit"}, {"id": "decimals", "value": 1}, {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.0001}]}}, {"id": "custom.cellOptions", "value": {"type": "color-text"}}]}, {"matcher": {"id": "byName", "options": "429 count"}, "properties": [{"id": "unit", "value": "none"}, {"id": "decimals", "value": 0}, {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, {"id": "custom.cellOptions", "value": {"type": "color-text"}}]}, {"matcher": {"id": "byName", "options": "Avg latency"}, "properties": [{"id": "unit", "value": "ms"}, {"id": "decimals", "value": 1}]}, {"matcher": {"id": "byName", "options": "p90"}, "properties": [{"id": "unit", "value": "ms"}, {"id": "decimals", "value": 1}]}, {"matcher": {"id": "byName", "options": "p95"}, "properties": [{"id": "unit", "value": "ms"}, {"id": "decimals", "value": 1}]}, {"matcher": {"id": "byName", "options": "p99"}, "properties": [{"id": "unit", "value": "ms"}, {"id": "decimals", "value": 1}]}]},
          "options": {"showHeader": true, "cellHeight": "sm", "sortBy": [{"displayName": "Calls", "desc": true}]}
        }
      ]
    }
