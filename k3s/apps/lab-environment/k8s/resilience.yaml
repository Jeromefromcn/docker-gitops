# Resident production policies: every one of these is behaviour a real
# deployment would carry, not a demo extra.
#
# Retries happen only at internal hops and only for idempotent GETs on
# transient failures. 500 is deliberately not in retryOn: that is an
# application bug, and retrying it just multiplies the damage.
#
# Retries do not compound across hops here — measured, not assumed (ledger C,
# 2026-09-29): with visits-service answering 503 to everything
# (chaos/visits-service/fail-instance), one external GET produced exactly
# 3 attempts at visits on both paths that reach it (access log attempts=3,
# URX), not the 3 x 3 = 9 the policy alone would allow:
#   /api/customer/owners/{id}/visits: customers-service turns visits' 503
#     into a 502, which is not in retryOn, so the customers hop logs
#     attempts=1; the client gets 502.
#   /api/gateway/owners/{id}: api-gateway calls visits itself (one hop, 3
#     attempts); its Resilience4j fallback returns 200 without visits.
# The ingress -> api-gateway hop never retries (attempts: 0 below). Latency
# stays bounded by perTryTimeout (1s per try). Compounding would become real
# only if a caller passed a 503 through unchanged; the fix then is a per-hop
# retry budget or dropping 503 from the inner hops — not retries at the edge.
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: lab-environment
spec:
  hosts:
    - api-gateway.lab-environment.svc.cluster.local
  http:
    - route:
        - destination:
            host: api-gateway.lab-environment.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 0
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: customers-service
  namespace: lab-environment
spec:
  hosts:
    - customers-service.lab-environment.svc.cluster.local
  # Pinned to the stable subset: this pin is the routing baseline every
  # routing demo (docs/demo/09-13) returns to, and demo-baseline checks it.
  http:
    - match:
        - method:
            exact: GET
      route:
        - destination:
            host: customers-service.lab-environment.svc.cluster.local
            subset: stable
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    # Anything that is not an idempotent GET: no retry, looser timeout.
    - route:
        - destination:
            host: customers-service.lab-environment.svc.cluster.local
            subset: stable
      timeout: 5s
      retries:
        attempts: 0
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: visits-service
  namespace: lab-environment
spec:
  hosts:
    - visits-service.lab-environment.svc.cluster.local
  http:
    - match:
        - method:
            exact: GET
      route:
        - destination:
            host: visits-service.lab-environment.svc.cluster.local
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    - route:
        - destination:
            host: visits-service.lab-environment.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 0
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: vets-service
  namespace: lab-environment
spec:
  hosts:
    - vets-service.lab-environment.svc.cluster.local
  http:
    - match:
        - method:
            exact: GET
      route:
        - destination:
            host: vets-service.lab-environment.svc.cluster.local
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    - route:
        - destination:
            host: vets-service.lab-environment.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 0
---
# maxEjectionPercent 50: with 5 customers pods at most 2 are ejected at once;
# with a single replica (vets, visits) it floors to 0, because Envoy never
# ejects the last healthy host of a cluster by design. That asymmetry is real
# production behaviour and is a demo talking point, not a gap.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-gateway
  namespace: lab-environment
spec:
  host: api-gateway.lab-environment.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: customers-service
  namespace: lab-environment
spec:
  host: customers-service.lab-environment.svc.cluster.local
  # Subsets for the canary slot (customers-service-canary.yaml). Traffic
  # policy stays at the top level, so both subsets get the same outlier
  # detection and pool.
  subsets:
    - name: stable
      labels:
        track: stable
    - name: canary
      labels:
        track: canary
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: visits-service
  namespace: lab-environment
spec:
  host: visits-service.lab-environment.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: vets-service
  namespace: lab-environment
spec:
  host: vets-service.lab-environment.svc.cluster.local
  trafficPolicy:
    # Tighter than the other services: vets holds 5 DB connections, so a
    # deep queue in front of it only turns load into 3 s waits. Past 10 in
    # flight and 5 queued (per waypoint replica) Envoy fails fast with
    # 503 UO instead.
    connectionPool:
      tcp:
        maxConnections: 10
      http:
        http1MaxPendingRequests: 5
        http2MaxRequests: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
