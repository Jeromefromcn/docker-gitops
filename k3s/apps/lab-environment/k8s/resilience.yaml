# Resident production policies: every one of these is behaviour a real
# deployment would carry, not a demo extra.
#
# Retries happen only at internal hops and only for idempotent GETs on
# transient failures. 500 is deliberately not in retryOn: that is an
# application bug, and retrying it just multiplies the damage.
#
# Retries DO compound across hops, and the budget is not as small as it looks.
# The api-gateway VirtualService below only covers the ingress -> api-gateway
# hop; it does nothing about api-gateway -> customers or customers -> visits,
# and both of those carry 503 in retryOn. One external GET can therefore
# become 3 attempts at the gateway, each fanning out to 3 at customers, each
# to 3 at visits: 9 requests to the deepest service. Latency stays bounded by
# perTryTimeout (1s per try), the attempt count does not.
#
# This is currently latent rather than active: the three chaos scenarios all
# measure attempts=1, because their symptoms are 502/504/UT and none of those
# is in retryOn. It becomes live the moment a dependency fails with 503.
# If that matters, the fix is a per-hop retry budget or dropping 503 from the
# inner hops — not adding retries at the edge.
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: lab-environment
spec:
  hosts:
    - api-gateway.lab-environment.svc.cluster.local
  http:
    - route:
        - destination:
            host: api-gateway.lab-environment.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 0
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: customers-service
  namespace: lab-environment
spec:
  hosts:
    - customers-service.lab-environment.svc.cluster.local
  http:
    - match:
        - method:
            exact: GET
      route:
        - destination:
            host: customers-service.lab-environment.svc.cluster.local
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    # Anything that is not an idempotent GET: no retry, looser timeout.
    - route:
        - destination:
            host: customers-service.lab-environment.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 0
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: visits-service
  namespace: lab-environment
spec:
  hosts:
    - visits-service.lab-environment.svc.cluster.local
  http:
    - match:
        - method:
            exact: GET
      route:
        - destination:
            host: visits-service.lab-environment.svc.cluster.local
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    - route:
        - destination:
            host: visits-service.lab-environment.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 0
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: vets-service
  namespace: lab-environment
spec:
  hosts:
    - vets-service.lab-environment.svc.cluster.local
  http:
    - match:
        - method:
            exact: GET
      route:
        - destination:
            host: vets-service.lab-environment.svc.cluster.local
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    - route:
        - destination:
            host: vets-service.lab-environment.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 0
---
# maxEjectionPercent 50: with 5 customers pods at most 2 are ejected at once;
# with a single replica (vets, visits) it floors to 0, because Envoy never
# ejects the last healthy host of a cluster by design. That asymmetry is real
# production behaviour and is a demo talking point, not a gap.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-gateway
  namespace: lab-environment
spec:
  host: api-gateway.lab-environment.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: customers-service
  namespace: lab-environment
