apiVersion: apps/v1
kind: Deployment
metadata:
  name: visits-service
  namespace: lab-environment
  labels:
    app: visits-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One extra pod at a time: zero downtime, and never more than one JVM
      # booting at once on the 2-core node.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: visits-service
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: visits-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /actuator/prometheus
        # Bump to roll the pods without a new image (e.g. after a secret rotation).
        lab.jerome/rollout-rev: "4"
    spec:
      serviceAccountName: visits-service
      enableServiceLinks: false
      containers:
        - name: visits-service
          image: ops-lab/visits-service:21d8461c6ce4
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: SPRING_CLOUD_CONSUL_HOST
              value: "consul"
            - name: SPRING_CLOUD_CONSUL_PORT
              value: "8500"
            # Overrides nothing: the Consul KV key config/<svc>/data/db.password
            # is deleted; the password lives only in this SealedSecret.
            - name: DATA_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: lab-db-credentials, key: password}
            # Schema/seed is owned by the db-init PreSync Job (db-init.yaml);
            # the fork's own init DROPs tables on every start.
            - name: SPRING_SQL_INIT_MODE
              value: "never"
            # Pools are sized against postgres max_connections across all
            # replicas (7 pods x 5), not left at Hikari's default 10 each.
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
              value: "5"
            # JVM container-detection is broken under this containerd/cgroup v2
            # (MaxHeap defaults to ~6Gi = 25% of host RAM), so the heap grows
            # past the 512Mi limit and gets OOM-killed. The apps only use
            # ~100Mi heap — pin it explicitly.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -Xms64m -XX:MaxDirectMemorySize=64m -XX:MaxRAM=512m"
            # RSS sits ~270Mi above what the JVM's own heap/metaspace metrics
            # report (confirmed flat over 15h with zero traffic, so it's not
            # a leak) — glibc's default per-thread malloc arenas over
            # fragment native memory the JVM never sees. Cap arena count
            # instead of leaving it unbounded.
            - name: MALLOC_ARENA_MAX
              value: "2"
          ports:
            - containerPort: 8082
          resources:
            # Request ~ observed RSS (270-340Mi) plus headroom, so the
            # scheduler doesn't reserve the full limit; the limit stays the
            # OOM ceiling. Heap is -Xms64m/-Xmx192m — non-heap drives RSS.
            # CPU request ~ steady-state usage (4-7m measured); startup
            # bursts into the limit instead of being reserved.
            requests:
              cpu: 20m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          # Spring Boot startup is CPU-bound: at the old 250m limit it took
          # 61-98 s with ~half of all CFS periods throttled. The limit only
          # bites during startup; steady state sits far below it.
          # startupProbe holds readiness off until the app is actually up
          # (up to 300 s: CPU requests are at steady-state usage, so when
          # every JVM starts at once they share 2 cores and start slowly —
          # accepted, as long as none is killed mid-start); readinessProbe
          # then uses Spring's own readiness group, so "Ready" means
          # "serving", not "container started".
          # Keep serving while the endpoint removal reaches the waypoint:
          # without it the app exits on SIGTERM while the waypoint still
          # routes to the pod, and those requests fail 503 UF mid-rollout.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: visits-service
  namespace: lab-environment
  labels:
    istio.io/use-waypoint: waypoint
spec:
  selector:
    app: visits-service
  ports:
    - port: 8082
      targetPort: 8082
