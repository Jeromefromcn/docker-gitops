apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: lab-environment
spec:
  accessModes:
    - ReadWriteOnce
  # Static PV on vps-oracle2, see pv.yaml.
  storageClassName: ""
  volumeName: lab-environment-postgres
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab-environment
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          # Keepalives reap backends whose client vanished without a FIN
          # (2026-09-25: enrolling running pods into ambient left ~30 leaked
          # half-open connections and exhausted max_connections). 200 leaves
          # room for rolling-update surge pods on top of 7 pools x 5.
          args:
            - "-c"
            - "max_connections=200"
            - "-c"
            - "tcp_keepalives_idle=60"
            - "-c"
            - "tcp_keepalives_interval=10"
            - "-c"
            - "tcp_keepalives_count=6"
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: lab-db-credentials, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: lab-db-credentials, key: password}
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "customers,vets,visits"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init-multiple-databases.sh
              subPath: init-multiple-databases.sh
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
        - name: init-script
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab-environment
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
