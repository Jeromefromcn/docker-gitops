apiVersion: apps/v1
kind: Deployment
metadata:
  name: vets-service
  namespace: lab-environment
  labels:
    app: vets-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vets-service
  template:
    metadata:
      labels:
        trivy-operator.skip: "true"
        app: vets-service
    spec:
      enableServiceLinks: false
      containers:
        - name: vets-service
          image: ops-lab/vets-service:83323857b5ba
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: SPRING_CLOUD_CONSUL_HOST
              value: "consul"
            - name: SPRING_CLOUD_CONSUL_PORT
              value: "8500"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS
              value: "true"
            # JVM container-detection is broken under this containerd/cgroup v2
            # (MaxHeap defaults to ~6Gi = 25% of host RAM), so the heap grows
            # past the 512Mi limit and gets OOM-killed. The apps only use
            # ~100Mi heap — pin it explicitly.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -Xms64m -XX:MaxDirectMemorySize=64m -XX:MaxRAM=512m"
          ports:
            - containerPort: 8083
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # Spring Boot startup is CPU-bound: at the old 250m limit it took
          # 61-98 s with ~half of all CFS periods throttled. The limit only
          # bites during startup; steady state sits far below it.
          # startupProbe holds readiness off until the app is actually up
          # (up to 180 s); readinessProbe then uses Spring's own readiness
          # group, so "Ready" means "serving", not "container started".
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vets-service
  namespace: lab-environment
spec:
  selector:
    app: vets-service
  ports:
    - port: 8083
      targetPort: 8083
