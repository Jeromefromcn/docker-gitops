# No istio.io/use-waypoint: lane traffic arrives through the baseline
# Service's waypoint route; nothing addresses this Service directly.
apiVersion: v1
kind: Service
metadata:
  name: vets-service-lane
  labels:
    app: vets-service-lane
    lab.jerome/lane: template
spec:
  selector:
    app: vets-service-lane
    lab.jerome/lane: template
  ports:
    - port: 8083
      targetPort: 8083
