# app: customers-service-lane, never customers-service: the baseline Service
# selects on app, and a lane pod it selected would take ordinary traffic.
# Same ServiceAccount as the baseline, so postgres/redis admit it and it
# shares the baseline's data. Recreate: a lane never runs two pods (the
# lanes live inside page 12's blue-green headroom, 2 lane pods at most).
# Container fields mirror k8s/customers-service.yaml - tests/test-lanes.sh
# fails if they drift; see the baseline for why each value is what it is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service-lane
  labels:
    app: customers-service-lane
    lab.jerome/lane: template
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: customers-service-lane
      lab.jerome/lane: template
  template:
    metadata:
      labels:
        app: customers-service-lane
        lab.jerome/lane: template
        # Fixed value for the lane-direct L4 policy: Istio selectors match
        # label values, not label presence.
        lab.jerome/lane-pod: "true"
        # Short-lived; CI's Trivy gate is a lane's vulnerability gate.
        trivy-operator.skip: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: customers-service
      enableServiceLinks: false
      containers:
        - name: customers-service
          # Never exists on GHCR: the ApplicationSet's kustomize.images sets
          # the PR head SHA. Unresolved, Kyverno refuses it at admission.
          image: ghcr.io/jeromefromcn/petclinic-customers-service:placeholder
          env:
          - name: TZ
            value: Asia/Hong_Kong
          - name: SPRING_CLOUD_CONSUL_HOST
            value: consul
          - name: SPRING_CLOUD_CONSUL_PORT
            value: '8500'
          - name: DATA_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: lab-db-credentials
                key: password
          - name: SPRING_SQL_INIT_MODE
            value: never
          - name: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
            value: '5'
          - name: JAVA_TOOL_OPTIONS
            value: -Xmx192m -Xms64m -XX:MaxDirectMemorySize=64m -XX:MaxRAM=512m
          - name: MALLOC_ARENA_MAX
            value: '2'
          ports:
          - containerPort: 8081
          resources:
            requests:
              cpu: 20m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
