# app: api-gateway-lane, never api-gateway: the baseline Service
# selects on app, and a lane pod it selected would take ordinary traffic.
# Same ServiceAccount as the baseline, so postgres/redis admit it and it
# shares the baseline's data. Recreate: a lane never runs two pods (the
# lanes live inside page 12's blue-green headroom, 2 lane pods at most).
# Container fields mirror k8s/api-gateway.yaml - tests/test-lanes.sh
# fails if they drift; see the baseline for why each value is what it is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-lane
  labels:
    app: api-gateway-lane
    lab.jerome/lane: template
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway-lane
      lab.jerome/lane: template
  template:
    metadata:
      labels:
        app: api-gateway-lane
        lab.jerome/lane: template
        # Fixed value for the lane-direct L4 policy: Istio selectors match
        # label values, not label presence.
        lab.jerome/lane-pod: "true"
        # Short-lived; CI's Trivy gate is a lane's vulnerability gate.
        trivy-operator.skip: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: api-gateway
      enableServiceLinks: false
      containers:
        - name: api-gateway
          # Never exists on GHCR: the ApplicationSet's kustomize.images sets
          # the PR head SHA. Unresolved, Kyverno refuses it at admission.
          image: ghcr.io/jeromefromcn/petclinic-api-gateway:placeholder
          envFrom:
          - configMapRef:
              name: lab-metrics-defaults
          env:
          - name: TZ
            value: Asia/Hong_Kong
          - name: SPRING_CLOUD_CONSUL_HOST
            value: consul
          - name: SPRING_CLOUD_CONSUL_PORT
            value: '8500'
          - name: JAVA_TOOL_OPTIONS
            value: -Xmx192m -Xms64m -XX:MaxDirectMemorySize=64m -XX:MaxRAM=512m
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
