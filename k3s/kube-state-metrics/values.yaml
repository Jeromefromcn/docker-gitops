fullnameOverride: kube-state-metrics

# vps_oracle, not vps-oracle2: oracle2's CPU requests are the lab's next
# ceiling, and a metrics source should not share a failure domain with the
# chaos node it reports on.
nodeSelector:
  kubernetes.io/hostname: instance-20260321-2043

# 30115 is for the vps_oracle compose Prometheus. That container is on a
# Docker bridge, so it reaches the NodePort through nodeport-relay@30115
# (vps_oracle/host-native/npm-nodeport-relay/).
service:
  type: NodePort
  nodePort: 30115

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    cpu: 100m
    memory: 128Mi
