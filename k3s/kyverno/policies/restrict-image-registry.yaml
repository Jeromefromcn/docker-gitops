apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registry
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-ghcr-jeromefromcn-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - pr-lanes
          # Lab PR lanes carry lab.jerome/lane and are verified by
          # restrict-image-registry-lab-lanes, which also accepts PR builds.
          - resources:
              namespaces:
                - lab-environment
              selector:
                matchExpressions:
                  - key: lab.jerome/lane
                    operator: Exists
      verifyImages:
        - imageReferences:
            - "ghcr.io/jeromefromcn/*"
          # CI signs with cosign v3 keyless, which stores signatures as
          # Sigstore bundles in OCI referrers (no legacy sha256-<digest>.sig
          # tag). The default type "Cosign" only reads the legacy tag and
          # fails with "no signatures found".
          type: SigstoreBundle
          mutateDigest: false
          attestors:
            - entries:
                - keyless:
                    # keyless.subject is an exact match (no wildcards); use
                    # subjectRegExp to cover every repo workflow.
                    subjectRegExp: "^https://github\\.com/Jeromefromcn/(docker-gitops/\\.github/workflows/[^/]+\\.yml@refs/heads/main|spring-petclinic-microservices/\\.github/workflows/lab-images\\.yml@refs/heads/(main|lab-v2))$"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
