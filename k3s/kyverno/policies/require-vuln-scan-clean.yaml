apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-vuln-scan-clean
  annotations:
    # This policy's context.apiCall.urlPath hardcodes Pod-shaped JMESPath
    # (request.object.metadata.*). Kyverno's autogen feature would otherwise
    # generate variant rules for Deployment/ReplicaSet/etc. that rewrite
    # those paths to spec.template.metadata.* -- breaking the apiCall's
    # URL templating. Pod-level interception (when the ReplicaSet
    # controller actually creates the Pod) is sufficient; autogen isn't
    # needed here.
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: block-critical-fixable-cves
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - hello-frontend
                      - hello-backend
                      # lab-environment's business services (baseline only:
                      # customers-service-canary and PR lane pods keep
                      # trivy-operator.skip, so no report exists for them;
                      # CI's Trivy gate covers their images).
                      - api-gateway
                      - customers-service
                      - vets-service
                      - visits-service
      context:
        # Trivy Operator names a report after the Pod's owner (the ReplicaSet),
        # or after the Pod itself when it has none. Without the fallback a
        # bare Pod failed the lookup ("Unknown key ownerReferences") and was
        # refused for that, not for a CVE (found 2026-10-06, docs/demo/18).
        - name: vulnreports
          apiCall:
            urlPath: "/apis/aquasecurity.github.io/v1alpha1/namespaces/{{request.object.metadata.namespace}}/vulnerabilityreports?labelSelector=trivy-operator.resource.name={{request.object.metadata.ownerReferences[0].name || request.object.metadata.name}}"
            jmesPath: "items[]"
      validate:
        message: >-
          Image has CRITICAL vulnerabilities with an available fix
          (Trivy VulnerabilityReport {{ request.object.metadata.name }}).
          Wait for a patched base image or fixed dependency, or add a
          documented exception before this can deploy.
        deny:
          conditions:
            all:
              - key: "{{ vulnreports[].report.vulnerabilities[] | [?severity=='CRITICAL' && fixedVersion!=''] | length(@) }}"
                operator: GreaterThan
                value: 0
