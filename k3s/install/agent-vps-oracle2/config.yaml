# k3s agent config for vps-oracle2, installed to /etc/rancher/k3s/config.yaml
# by install.sh (run from vps_oracle). The join token is deliberately NOT here:
# install.sh reads it from the server over SSH and hands it to the installer.
#
# The server is vps_oracle's k3s (k3s/install/config.yaml); both
# nodes talk over tailscale, since the two hosts are in separate OCI tenancies.
server: https://100.84.203.73:6443
node-ip: 100.100.140.33

# Run the agent's local apiserver load-balancer on 127.0.0.1:6443 (default
# 6444). Cilium is installed with k8sServiceHost=127.0.0.1 / port 6443 — true on
# the server because the apiserver itself listens there — so this makes the same
# Cilium values valid on this node too, without pointing the server's own Cilium
# at a tailscale address.
lb-server-port: 6443

# Only workloads that explicitly tolerate this land here (lab-environment gets
# the toleration + nodeSelector injected by a Kyverno mutate policy). Every
# management component — ArgoCD, Kyverno, sealed-secrets, istiod, coredns... —
# stays on vps_oracle. Per-node DaemonSets (cilium, cilium-envoy, istio-cni,
# ztunnel) tolerate all taints and run here as they must.
node-taint:
  - dedicated=lab:NoSchedule
node-label:
  - dedicated=lab

# Reserve room for what runs here outside pods, which the scheduler cannot
# see. Sized from measured anon memory (cgroup memory.stat) on 2026-09-28,
# after dify was decommissioned to give its ~1.4Gi to the lab:
#   system-reserved: everything in system/user/init slices except k3s-agent
#     (docker compose stacks under vps_oracle2/compose/ - sillytavern,
#     glances, portainer-agent, node-exporter - plus docker, containerd,
#     tailscaled and the OCI agents) = 702Mi, + 512Mi for kernel and page
#     cache -> 1280Mi; CPU near zero, 200m kept.
#   kube-reserved: k3s-agent itself, measured 312Mi -> 384Mi (the old 256Mi
#     was already exceeded); ~90m CPU -> 100m.
# Without a reservation allocatable equalled capacity, so pods could be
# scheduled into memory these processes already use. Allocatable becomes
# 1700m / ~10.0Gi; the lab quota (k3s/apps/lab-environment/k8s/namespace.yaml)
# is sized against it - change both files together.
kubelet-arg:
  - "system-reserved=cpu=200m,memory=1280Mi"
  - "kube-reserved=cpu=100m,memory=384Mi"
