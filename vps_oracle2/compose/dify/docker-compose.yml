  web:
    image: langgenius/dify-web:1.14.2@sha256:db73434e185ac778f31f4cc1adcce0dbe84b41a95ea5af58216acf095eed5f67
    container_name: dify-web
    hostname: dify-web
    # Bound to this host's tailscale IP only: NPM on vps_oracle forwards everything else here over the mesh.
    ports:
      - "100.100.140.33:3000:3000"
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: "Asia/Hong_Kong"
      # dify-web's server.js binds to $HOSTNAME (Docker auto-sets this from the
      # `hostname:` field above), not 0.0.0.0. Left as-is it only listens on the
      # `default` network's IP, refusing connections from `proxy` (i.e. from NPM).
      HOSTNAME: "0.0.0.0"
      # MUST match api's CONSOLE_WEB_URL/CONSOLE_API_URL scheme (both https) —
      # web/config/index.ts computes CSRF_COOKIE_NAME()'s "isSecure" from
      # API_PREFIX.startsWith('https://'), independently of the backend's own
      # is_secure() (CONSOLE_WEB_URL/CONSOLE_API_URL on api). If these disagree,
      # one side sets/expects a `__Host-csrf_token` cookie and the other side
      # reads/sends plain `csrf_token` — the names never match, every CSRF-
      # checked request gets rejected ("CSRF token is missing or invalid."),
      # and login effectively never sticks. Leaving these empty here (relying on
      # same-origin relative paths) is what caused that: empty doesn't start
      # with "https://", so isSecure was false here while true on api.
      CONSOLE_API_URL: "https://dify.jerome.cloudns.asia"
      APP_API_URL: "https://dify.jerome.cloudns.asia"
      # Server-side rendering runs inside this container, with no incoming-request
      # host to infer "same origin" from, so it needs the api container reachable directly.
      SERVER_CONSOLE_API_URL: "http://api:5001"
      MARKETPLACE_API_URL: "https://marketplace.dify.ai"
      MARKETPLACE_URL: "https://marketplace.dify.ai"
    depends_on:
      - api
    networks:
      - default
