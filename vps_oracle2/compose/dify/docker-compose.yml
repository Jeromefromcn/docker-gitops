# Dify 1.14.2, trimmed from the official docker/docker-compose.yaml:
# - no bundled nginx (NPM does path-based routing instead, see README.md)
# - no sandbox (Workflow "Code" node is unavailable until it's added back)
# - no certbot (NPM manages TLS)
# - vector store: pgvector (own Postgres container, not the same instance as db_postgres)
# - skips 1.16.x's new agent_backend/local_sandbox/agent_ssrf_proxy/api_websocket subsystem
#   by pinning below 1.16, since that feature isn't needed here.
# - pinned to 1.14.2, not 1.15.x: 1.15.0 changed web/hooks/use-timestamp.ts to fire its
#   own independent GET /console/api/account/profile via react-query (was: read from
#   already-loaded app context, no network call). A transient 401 on that background call
#   triggers an unconditional client-side redirect to /signin in web/service/base.ts (no
#   "silent"/best-effort gating — a fix was proposed in dify PR #38273 but never merged),
#   which reloads the page, re-fires the same hook, and can loop forever. Confirmed via
#   diff against the 1.14.2 source (upstream issue #38457, same version, same symptom).
#   1.14.2 doesn't have that background call at all, so the loop's trigger doesn't exist.
# - no init_permissions one-shot container: api/worker run as uid 1001 (the "dify" user)
#   and need write access to the storage bind mount, so instead of a container that just
#   exits after a chown, that chown was done once on the host:
#     sudo chown -R 1001:1001 /etc/dify/storage
#   (this host's "ubuntu" user happens to be uid 1001; adjust if reused elsewhere)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

configs:
  squid_conf_template:
    content: |
      acl client_localnet src 0.0.0.1-0.255.255.255	# RFC 1122 "this" network (LAN)
      acl client_localnet src 10.0.0.0/8		# RFC 1918 local private network (LAN)
      acl client_localnet src 100.64.0.0/10		# RFC 6598 shared address space (CGN)
      acl client_localnet src 169.254.0.0/16 	# RFC 3927 link-local (directly plugged) machines
      acl client_localnet src 172.16.0.0/12		# RFC 1918 local private network (LAN)
      acl client_localnet src 192.168.0.0/16		# RFC 1918 local private network (LAN)
      acl client_localnet src fc00::/7       	# RFC 4193 local private network range
      acl client_localnet src fe80::/10      	# RFC 4291 link-local (directly plugged) machines
      acl to_private_networks dst 0.0.0.0/8
      acl to_private_networks dst 10.0.0.0/8
      acl to_private_networks dst 100.64.0.0/10
      acl to_private_networks dst 127.0.0.0/8
      acl to_private_networks dst 169.254.0.0/16
      acl to_private_networks dst 172.16.0.0/12
      acl to_private_networks dst 192.168.0.0/16
      acl to_private_networks dst 224.0.0.0/4
      acl to_private_networks dst 240.0.0.0/4
      acl to_private_networks dst ::/128
      acl to_private_networks dst ::1/128
      acl to_private_networks dst ::ffff:0:0/96    # IPv4-mapped
      acl to_private_networks dst ::/96            # deprecated IPv4-compatible
      acl to_private_networks dst fc00::/7
      acl to_private_networks dst fe80::/10
      acl SSL_ports port 443
      # acl SSL_ports port 1025-65535   # Enable the configuration to resolve this issue: https://github.com/langgenius/dify/issues/12792
      acl Safe_ports port 80		# http
      acl Safe_ports port 21		# ftp
      acl Safe_ports port 443		# https
      acl Safe_ports port 70		# gopher
      acl Safe_ports port 210		# wais
      acl Safe_ports port 1025-65535	# unregistered ports
      acl Safe_ports port 280		# http-mgmt
      acl Safe_ports port 488		# gss-http
      acl Safe_ports port 591		# filemaker
      acl Safe_ports port 777		# multiling http
      acl CONNECT method CONNECT
      acl allowed_domains dstdomain .marketplace.dify.ai

      http_port $${HTTP_PORT}

      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports
      http_access allow localhost manager
      http_access deny manager
      include /etc/squid/dify_sandbox_proxy.conf
      include /etc/squid/dify_allow_private.conf
      http_access deny to_private_networks
      http_access allow allowed_domains
      http_access allow client_localnet
      http_access allow localhost
      http_access deny all
      tcp_outgoing_address 0.0.0.0

      ################################## Proxy Server ################################
      coredump_dir $${COREDUMP_DIR}
      refresh_pattern ^ftp:		1440	20%	10080
      refresh_pattern ^gopher:	1440	0%	1440
      refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
      refresh_pattern \/(Packages|Sources)(|\.bz2|\.gz|\.xz)$$ 0 0% 0 refresh-ims
      refresh_pattern \/Release(|\.gpg)$$ 0 0% 0 refresh-ims
      refresh_pattern \/InRelease$$ 0 0% 0 refresh-ims
      refresh_pattern \/(Translation-.*)(|\.bz2|\.gz|\.xz)$$ 0 0% 0 refresh-ims
      refresh_pattern .		0	20%	4320


      # cache_dir ufs /var/spool/squid 100 16 256
      # upstream proxy, set to your own upstream proxy IP to avoid SSRF attacks
      # cache_peer 172.1.1.1 parent 3128 0 no-query no-digest no-netdb-exchange default

      ################################## Request Buffer ################################

      # Unless the option's size is increased, an error will occur when uploading more than two files.
      client_request_buffer_max_size 100 MB

      ################################## Performance & Concurrency ###############################
      # Increase file descriptor limit for high concurrency
      max_filedescriptors 65536

      # Timeout configurations for image requests
      connect_timeout 30 seconds
      request_timeout 2 minutes
      read_timeout 2 minutes
      client_lifetime 5 minutes
      shutdown_lifetime 30 seconds

      # Persistent connections - improve performance for multiple requests
      server_persistent_connections on
      client_persistent_connections on
      persistent_request_timeout 30 seconds
      pconn_timeout 1 minute

      # Connection pool and concurrency limits
      client_db on
      server_idle_pconn_timeout 2 minutes
      client_idle_pconn_timeout 2 minutes

      # Quick abort settings - don't abort requests that are mostly done
      quick_abort_min 16 KB
      quick_abort_max 16 MB
      quick_abort_pct 95

      # Memory and cache optimization
      memory_cache_mode disk
      cache_mem 256 MB
      maximum_object_size_in_memory 512 KB

      # DNS resolver settings for better performance
      dns_timeout 30 seconds
      dns_retransmit_interval 5 seconds
      # By default, Squid uses the system's configured DNS resolvers.
      # If you need to override them, set dns_nameservers to appropriate servers
      # for your environment (for example, internal/corporate DNS). The following
      # is an example using public DNS and SHOULD be customized before use:
      # dns_nameservers 8.8.8.8 8.8.4.4

      # Logging format for better debugging
      logformat dify_log %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
      access_log daemon:/var/log/squid/access.log dify_log

      # Access log to track concurrent requests and timeouts
      logfile_rotate 10
  squid_entrypoint:
    content: |
      #!/bin/bash

      # Modified based on Squid OCI image entrypoint

      # This entrypoint aims to forward the squid logs to stdout to assist users of
      # common container related tooling (e.g., kubernetes, docker-compose, etc) to
      # access the service logs.

      # Moreover, it invokes the squid binary, leaving all the desired parameters to
      # be provided by the "command" passed to the spawned container. If no command
      # is provided by the user, the default behavior (as per the CMD statement in
      # the Dockerfile) will be to use Ubuntu's default configuration [1] and run
      # squid with the "-NYC" options to mimic the behavior of the Ubuntu provided
      # systemd unit.

      # [1] The default configuration is changed in the Dockerfile to allow local
      # network connections. See the Dockerfile for further information.

      echo "[ENTRYPOINT] re-create snakeoil self-signed certificate removed in the build process"
      if [ ! -f /etc/ssl/private/ssl-cert-snakeoil.key ]; then
          /usr/sbin/make-ssl-cert generate-default-snakeoil --force-overwrite > /dev/null 2>&1
      fi

      tail -F /var/log/squid/access.log 2>/dev/null &
      tail -F /var/log/squid/error.log 2>/dev/null &
      tail -F /var/log/squid/store.log 2>/dev/null &
      tail -F /var/log/squid/cache.log 2>/dev/null &

      ALLOW_PRIVATE_CONF=/etc/squid/dify_allow_private.conf
      SANDBOX_PROXY_CONF=/etc/squid/dify_sandbox_proxy.conf

      write_optional_private_allowlist() {
          local env_name="$$1"
          local acl_name="$$2"
          local acl_type="$$3"
          local raw_values="$${!env_name:-}"

          raw_values="$${raw_values//,/ }"

          if [ -z "$${raw_values//[[:space:]]/}" ]; then
              return
          fi

          printf 'acl %s %s' "$$acl_name" "$$acl_type" >> "$$ALLOW_PRIVATE_CONF"
          for value in $$raw_values; do
              printf ' %s' "$$value" >> "$$ALLOW_PRIVATE_CONF"
          done
          printf '\nhttp_access allow client_localnet %s\n' "$$acl_name" >> "$$ALLOW_PRIVATE_CONF"
      }

      {
          echo "# Generated by docker-entrypoint.sh."
          echo "# Allows selected private targets before the default private-network deny rule."
      } > "$$ALLOW_PRIVATE_CONF"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_IPS" "dify_allowed_private_networks" "dst"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_DOMAINS" "dify_allowed_private_domains" "dstdomain"

      {
          echo "# Generated by docker-entrypoint.sh."
          echo "# Enables the middleware-only sandbox host bridge when configured."
      } > "$$SANDBOX_PROXY_CONF"

      if [ -n "$${SSRF_SANDBOX_PROXY_PORT:-}" ]; then
          sandbox_proxy_host="$${SSRF_SANDBOX_PROXY_HOST:-sandbox}"
          sandbox_proxy_target_port="$${SANDBOX_PORT:-8194}"

          {
              printf 'http_port %s accel vhost\n' "$$SSRF_SANDBOX_PROXY_PORT"
              printf 'cache_peer %s parent %s 0 no-query originserver name=dify_sandbox\n' \
                  "$$sandbox_proxy_host" \
                  "$$sandbox_proxy_target_port"
              printf 'acl dify_sandbox_proxy_port localport %s\n' "$$SSRF_SANDBOX_PROXY_PORT"
              printf 'http_access allow dify_sandbox_proxy_port\n'
          } >> "$$SANDBOX_PROXY_CONF"
      fi

      # Replace environment variables in the template and output to the squid.conf
      echo "[ENTRYPOINT] replacing environment variables in the template"
      awk '{
          while(match($$0, /\$${[A-Za-z_][A-Za-z_0-9]*}/)) {
              var = substr($$0, RSTART+2, RLENGTH-3)
              val = ENVIRON[var]
              $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
          }
          print
      }' /etc/squid/squid.conf.template > /etc/squid/squid.conf

      /usr/sbin/squid -Nz
      echo "[ENTRYPOINT] starting squid"
      /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1

networks:
  # Mirrors upstream: isolates api/worker/worker_beat/plugin_daemon's outbound
  # traffic through ssrf_proxy, with no other route out.
  ssrf_proxy_network:
    driver: bridge
    internal: true

services:
  db_postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: dify-db
    hostname: dify-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      TZ: "Asia/Hong_Kong"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: dify
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c 'max_connections=100'
               -c 'shared_buffers=128MB'
               -c 'work_mem=4MB'
               -c 'maintenance_work_mem=64MB'
               -c 'effective_cache_size=1024MB'
    volumes:
      - /etc/dify/db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "dify"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Vector store for knowledge-base embeddings. Deliberately a separate Postgres
  # instance from db_postgres (upstream ships it that way, not a shared instance).
  pgvector:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    container_name: dify-pgvector
    hostname: dify-pgvector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      TZ: "Asia/Hong_Kong"
      PGUSER: postgres
      POSTGRES_PASSWORD: "${PGVECTOR_PASSWORD}"
      POSTGRES_DB: dify
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /etc/dify/pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:6-alpine@sha256:ec5e187c913d422cdf60f4216a5fdfb95246792c6de6fe21ff5bed75cbfc8c23
    container_name: dify-redis
    hostname: dify-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      TZ: "Asia/Hong_Kong"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - /etc/dify/redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Forward proxy that api/worker/worker_beat/plugin_daemon route outbound HTTP
  # through, so a workflow's HTTP-request node (or a plugin) can't be used to
  # reach internal-network / metadata-endpoint targets (SSRF). Unrelated to sandbox.
  ssrf_proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029  # :latest as of 2026-08-02, no stable versioned tag upstream
    container_name: dify-ssrf-proxy
    hostname: dify-ssrf-proxy
    restart: unless-stopped
    logging: *default-logging
    # Injected as configs (copied into the container at create time), not bind-mounted:
    # this stack is deployed from vps_oracle via `docker --context oracle2`, and a relative
    # bind mount would resolve on oracle2's filesystem, forcing a copy of the repo there.
    configs:
      - source: squid_conf_template
        target: /etc/squid/squid.conf.template
      - source: squid_entrypoint
        target: /docker-entrypoint-mount.sh
        mode: 0755
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      TZ: "Asia/Hong_Kong"
      HTTP_PORT: "3128"
      COREDUMP_DIR: "/var/spool/squid"
    networks:
      - ssrf_proxy_network
      - default

  # Plugin runtime. Mandatory in Dify 1.x: model providers (OpenAI, Anthropic, etc.)
  # and most tools are implemented as plugins, not just optional extras.
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.1-local@sha256:fa7ad45e1b2a777cd243b902609abecb4fd924adcd13d21ef4258b5090a09be5
    container_name: dify-plugin-daemon
    hostname: dify-plugin-daemon
    # Bound to this host's tailscale IP only: NPM on vps_oracle forwards /e/ here over the mesh.
    ports:
      - "100.100.140.33:5002:5002"
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: "Asia/Hong_Kong"
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DATABASE: dify_plugin
      # plugin_daemon connects here first, then issues CREATE DATABASE dify_plugin
      # against it if dify_plugin doesn't exist yet (see its internal/db/pg/pg.go).
      DB_DEFAULT_DATABASE: postgres
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_USE_SSL: "false"
      SERVER_PORT: "5002"
      # Never exposed outside the docker network (no host port published below),
      # so left at upstream's well-known internal default rather than randomized.
      SERVER_KEY: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      PPROF_ENABLED: "false"
      DIFY_INNER_API_URL: "http://api:5001"
      # Same reasoning as SERVER_KEY: internal-only, kept at upstream default.
      DIFY_INNER_API_KEY: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
      PLUGIN_REMOTE_INSTALLING_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      FORCE_VERIFYING_SIGNATURE: "true"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
    volumes:
      - /etc/dify/plugin-daemon-storage:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ssrf_proxy_network
      - default

  api:
    image: langgenius/dify-api:1.14.2@sha256:062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
    container_name: dify-api
    hostname: dify-api
    # Bound to this host's tailscale IP only: NPM on vps_oracle forwards /console/api, /api, /v1, /files, /mcp, /triggers, /openapi here over the mesh.
    ports:
      - "100.100.140.33:5001:5001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: "Asia/Hong_Kong"
      MODE: api
      SECRET_KEY: "${SECRET_KEY}"
      INIT_PASSWORD: "${INIT_PASSWORD}"
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      MIGRATION_ENABLED: "true"
      CONSOLE_WEB_URL: "https://dify.jerome.cloudns.asia"
      CONSOLE_API_URL: "https://dify.jerome.cloudns.asia"
      SERVICE_API_URL: "https://dify.jerome.cloudns.asia"
      APP_WEB_URL: "https://dify.jerome.cloudns.asia"
      FILES_URL: "https://dify.jerome.cloudns.asia"
      # Files served to plugin_daemon/internal callers use this instead of the
      # public FILES_URL, so that traffic stays inside the docker network instead
      # of round-tripping out through NPM/public DNS for a purely internal fetch.
      INTERNAL_FILES_URL: "http://api:5001"
      # Public webhook URL templates handed to users/external plugin providers
      # (e.g. a Slack Endpoint's callback URL, or a Trigger's webhook URL) —
      # left at upstream's "http://localhost/..." default these would be unusable
      # from outside. Match the /e/ and /triggers locations wired in NPM.
      ENDPOINT_URL_TEMPLATE: "https://dify.jerome.cloudns.asia/e/{hook_id}"
      TRIGGER_URL: "https://dify.jerome.cloudns.asia"
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_USE_SSL: "false"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD}"
      PGVECTOR_DATABASE: dify
      SSRF_PROXY_HTTP_URL: "http://ssrf_proxy:3128"
      SSRF_PROXY_HTTPS_URL: "http://ssrf_proxy:3128"
      PLUGIN_DAEMON_URL: "http://plugin_daemon:5002"
      PLUGIN_DAEMON_KEY: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
      # Remote plugin-debugging install feature: not reachable from outside since
      # port 5003 isn't published (see plugin_daemon below), so this is unused
      # rather than wrong — leaving at upstream default.
      PLUGIN_REMOTE_INSTALL_HOST: localhost
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      PLUGIN_DAEMON_TIMEOUT: "600.0"
      INNER_API_KEY_FOR_PLUGIN: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      plugin_daemon:
        condition: service_started
    volumes:
      - /etc/dify/storage:/app/api/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ssrf_proxy_network
      - default

  worker:
    image: langgenius/dify-api:1.14.2@sha256:062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
    container_name: dify-worker
    hostname: dify-worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: "Asia/Hong_Kong"
      MODE: worker
      SECRET_KEY: "${SECRET_KEY}"
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      # Needed here, not just on api: invite/register/reset-password emails are
      # sent by Celery tasks running in *this* container (api/tasks/mail_*.py),
      # and build their link text from these.
      CONSOLE_WEB_URL: "https://dify.jerome.cloudns.asia"
      CONSOLE_API_URL: "https://dify.jerome.cloudns.asia"
      SERVICE_API_URL: "https://dify.jerome.cloudns.asia"
      APP_WEB_URL: "https://dify.jerome.cloudns.asia"
      FILES_URL: "https://dify.jerome.cloudns.asia"
      INTERNAL_FILES_URL: "http://api:5001"
      ENDPOINT_URL_TEMPLATE: "https://dify.jerome.cloudns.asia/e/{hook_id}"
      TRIGGER_URL: "https://dify.jerome.cloudns.asia"
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_USE_SSL: "false"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD}"
      PGVECTOR_DATABASE: dify
      SSRF_PROXY_HTTP_URL: "http://ssrf_proxy:3128"
      SSRF_PROXY_HTTPS_URL: "http://ssrf_proxy:3128"
      PLUGIN_DAEMON_URL: "http://plugin_daemon:5002"
      PLUGIN_DAEMON_KEY: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      INNER_API_KEY_FOR_PLUGIN: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
      COMPOSE_WORKER_HEALTHCHECK_DISABLED: "true"
